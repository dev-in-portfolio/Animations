<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Echo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #08080e; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.08); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Echo · expanding waves</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const rings = [];

  function createRing(x, y) {
    const count = 40 + Math.floor(Math.random() * 30);
    const particles = [];
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2;
      particles.push({
        angle,
        hue: 200 + Math.random() * 60,
        phase: Math.random() * Math.PI * 2,
        size: 1.5 + Math.random() * 2,
      });
    }
    rings.push({ x, y, particles, radius: 5, life: 1, speed: 1 + Math.random() * 0.5 });
  }

  document.addEventListener('click', (e) => {
    for (let i = 0; i < 3; i++) {
      setTimeout(() => createRing(e.clientX, e.clientY), i * 300);
    }
  });

  createRing(W / 3, H / 2);
  createRing(W * 2 / 3, H / 2);

  let time = 0;

  function animate() {
    time += 0.005;
    ctx.fillStyle = 'rgba(8, 8, 14, 0.03)';
    ctx.fillRect(0, 0, W, H);

    for (let r = rings.length - 1; r >= 0; r--) {
      const ring = rings[r];
      ring.radius += ring.speed;
      ring.life -= 0.004;

      if (ring.life <= 0) { rings.splice(r, 1); continue; }

      for (const p of ring.particles) {
        const a = p.angle + time * 0.02;
        const wobble = Math.sin(time * 2 + p.phase + ring.radius * 0.05) * 3;
        const x = ring.x + Math.cos(a) * (ring.radius + wobble);
        const y = ring.y + Math.sin(a) * (ring.radius + wobble);

        const alpha = ring.life * 0.4;
        const size = p.size * ring.life;
        const hue = p.hue + Math.sin(time + p.phase) * 15;

        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${hue}, 75%, 60%, ${alpha})`;
        ctx.fill();
      }
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
