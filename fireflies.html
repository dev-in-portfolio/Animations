<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fireflies</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a14; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.1); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Fireflies · gentle floating lights</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const fireflies = [];
  const COUNT = 60;

  for (let i = 0; i < COUNT; i++) {
    fireflies.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      size: 1.5 + Math.random() * 3,
      phase: Math.random() * Math.PI * 2,
      glowPhase: Math.random() * Math.PI * 2,
      glowSpeed: 0.5 + Math.random() * 1.5,
      wander: Math.random() * Math.PI * 2,
      wanderSpeed: 0.1 + Math.random() * 0.3,
      hue: 40 + Math.random() * 30,
    });
  }

  const mouse = { x: W / 2, y: H / 2 };

  document.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  let time = 0;

  function animate() {
    time += 0.005;
    ctx.fillStyle = 'rgba(10, 10, 20, 0.06)';
    ctx.fillRect(0, 0, W, H);

    for (const f of fireflies) {
      f.wander += (Math.random() - 0.5) * 0.1;
      f.vx += Math.cos(f.wander) * 0.01;
      f.vy += Math.sin(f.wander) * 0.01;

      const dx = mouse.x - f.x;
      const dy = mouse.y - f.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 200) {
        f.vx -= dx * 0.0001;
        f.vy -= dy * 0.0001;
      }

      const speed = Math.sqrt(f.vx * f.vx + f.vy * f.vy);
      if (speed > 0.8) { f.vx *= 0.98; f.vy *= 0.98; }

      f.x += f.vx;
      f.y += f.vy;

      if (f.x < 0) f.x = W;
      if (f.x > W) f.x = 0;
      if (f.y < 0) f.y = H;
      if (f.y > H) f.y = 0;

      const glow = 0.3 + Math.sin(time * f.glowSpeed + f.glowPhase) * 0.7;
      const alpha = glow * 0.8;

      ctx.beginPath();
      ctx.arc(f.x, f.y, f.size * glow, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${f.hue}, 90%, 70%, ${alpha})`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(f.x, f.y, f.size * 3 * glow, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${f.hue}, 80%, 60%, ${alpha * 0.15})`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(f.x, f.y, f.size * 6 * glow, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${f.hue}, 70%, 50%, ${alpha * 0.05})`;
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
