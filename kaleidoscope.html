<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaleidoscope</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050508; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.1); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Kaleidoscope · mirrored symmetry</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const segments = 8;
  const cx = W / 2;
  const cy = H / 2;

  const dots = [];
  const COUNT = 30;

  for (let i = 0; i < COUNT; i++) {
    dots.push({
      radius: 20 + Math.random() * Math.min(W, H) * 0.35,
      angle: Math.random() * Math.PI * 2,
      speed: (Math.random() - 0.5) * 0.02,
      size: 3 + Math.random() * 8,
      hue: Math.random() * 360,
      hueSpeed: 0.1 + Math.random() * 0.3,
      pulse: Math.random() * Math.PI * 2,
      pulseSpeed: 0.5 + Math.random() * 1.5,
      wobble: Math.random() * Math.PI * 2,
      wobbleAmp: 5 + Math.random() * 15,
    });
  }

  let time = 0;
  const mouse = { x: cx, y: cy };

  document.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  function drawSector(x, y, radius, angle, size, hue, alpha) {
    const sectorAngle = (Math.PI * 2) / segments;
    for (let s = 0; s < segments; s++) {
      const baseAngle = s * sectorAngle;
      for (let mirror = 0; mirror < 2; mirror++) {
        const a = mirror === 0 ? baseAngle + angle : baseAngle + sectorAngle - angle;
        const px = x + Math.cos(a) * radius;
        const py = y + Math.sin(a) * radius;

        ctx.beginPath();
        ctx.arc(px, py, size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${alpha})`;
        ctx.fill();
      }
    }
  }

  function animate() {
    time += 0.004;
    ctx.fillStyle = 'rgba(5, 5, 8, 0.04)';
    ctx.fillRect(0, 0, W, H);

    const centerX = cx + (mouse.x - cx) * 0.05;
    const centerY = cy + (mouse.y - cy) * 0.05;

    for (const d of dots) {
      d.angle += d.speed;
      d.hue += d.hueSpeed;

      const pulse = Math.sin(time * d.pulseSpeed + d.pulse) * 0.3 + 0.7;
      const wobbleX = Math.sin(time * 0.5 + d.wobble) * d.wobbleAmp;
      const wobbleY = Math.cos(time * 0.4 + d.wobble) * d.wobbleAmp;

      const radius = d.radius + wobbleX;
      const angle = d.angle + Math.sin(time * 0.3) * 0.05;
      const size = d.size * pulse;
      const alpha = pulse * 0.6;

      drawSector(centerX, centerY, radius, angle, size, d.hue, alpha);
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
