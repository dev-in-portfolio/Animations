<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Eclipse</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050510; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.1); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Eclipse · corona rings</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const cx = W / 2;
  const cy = H / 2;
  const RINGS = 5;
  const particles = [];

  for (let r = 0; r < RINGS; r++) {
    const count = 120 + r * 40;
    const radius = 70 + r * 30;
    const hue = 30 + r * 20;
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2;
      const scatter = (Math.random() - 0.5) * 8;
      particles.push({
        angle,
        radius: radius + scatter,
        speed: 0.002 + (r / RINGS) * 0.006 + Math.random() * 0.001,
        hue: hue + Math.random() * 20,
        size: 2 + Math.random() * 3,
        phase: Math.random() * Math.PI * 2,
        pulseSpeed: 0.5 + Math.random() * 0.5,
        wobbleAmp: 2 + Math.random() * 4,
      });
    }
  }

  let time = 0;

  function animate() {
    time += 0.005;
    ctx.fillStyle = 'rgba(5, 5, 16, 0.04)';
    ctx.fillRect(0, 0, W, H);

    ctx.beginPath();
    ctx.arc(cx, cy, 35, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.95)';
    ctx.fill();

    for (const p of particles) {
      p.angle += p.speed;
      const pulse = 0.8 + Math.sin(time * p.pulseSpeed + p.phase) * 0.2;
      const wobble = Math.sin(time * 0.5 + p.wobbleAmp + p.angle) * p.wobbleAmp * pulse;
      const r = p.radius + wobble;
      const x = cx + Math.cos(p.angle) * r;
      const y = cy + Math.sin(p.angle) * r;

      const alpha = 0.1 + pulse * 0.4;
      const size = p.size * pulse;
      const hue = p.hue + Math.sin(time + p.phase) * 15;

      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, 85%, ${55 + pulse * 25}%, ${alpha})`;
      ctx.fill();

      const grad = ctx.createRadialGradient(x, y, 0, x, y, size * 5);
      grad.addColorStop(0, `hsla(${hue}, 90%, 70%, ${alpha * 0.06})`);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, size * 5, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(cx, cy, 32, 0, Math.PI * 2);
    const grad2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, 32);
    grad2.addColorStop(0, 'rgba(0, 0, 0, 1)');
    grad2.addColorStop(0.6, 'rgba(10, 5, 0, 0.8)');
    grad2.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grad2;
    ctx.fill();

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
