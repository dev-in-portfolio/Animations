<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constellation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #03030a; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.1); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Constellation · self-drawing star map</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function generateConstellation() {
    const stars = [];
    const count = 30 + Math.floor(Math.random() * 30);

    for (let i = 0; i < count; i++) {
      stars.push({
        x: 50 + Math.random() * (W - 100),
        y: 50 + Math.random() * (H - 100),
        size: 1 + Math.random() * 3,
        brightness: 0.3 + Math.random() * 0.7,
        hue: 200 + Math.random() * 80,
        phase: Math.random() * Math.PI * 2,
      });
    }

    const connections = [];
    for (let i = 0; i < stars.length; i++) {
      for (let j = i + 1; j < stars.length; j++) {
        const dx = stars[i].x - stars[j].x;
        const dy = stars[i].y - stars[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 150) {
          connections.push({ a: i, b: j, dist });
        }
      }
    }
    connections.sort((a, b) => a.dist - b.dist);
    const kept = connections.slice(0, Math.floor(connections.length * 0.4));

    return { stars, connections: kept };
  }

  let constellation = generateConstellation();
  let drawProgress = 0;
  let currentLine = 0;

  const mouse = { x: W / 2, y: H / 2 };

  document.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  let time = 0;

  function animate() {
    time += 0.003;
    ctx.fillStyle = 'rgba(3, 3, 10, 0.08)';
    ctx.fillRect(0, 0, W, H);

    const { stars, connections } = constellation;

    if (drawProgress < 1) {
      drawProgress += 0.003;
      if (drawProgress > 1) drawProgress = 1;
    }
    if (drawProgress >= 1 && currentLine < connections.length) {
      currentLine++;
    }

    for (let i = 0; i < currentLine && i < connections.length; i++) {
      const conn = connections[i];
      const a = stars[conn.a];
      const b = stars[conn.b];
      const alpha = 0.1 + Math.sin(time + i * 0.1) * 0.05;

      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = `hsla(${(a.hue + b.hue) / 2}, 50%, 60%, ${alpha})`;
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }

    for (const s of stars) {
      const twinkle = 0.5 + Math.sin(time * 2 + s.phase) * 0.5;
      const alpha = s.brightness * twinkle;

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size * (0.5 + twinkle * 0.5), 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${s.hue}, 60%, ${60 + twinkle * 20}%, ${alpha})`;
      ctx.fill();
    }

    if (drawProgress >= 1 && currentLine >= connections.length && Math.random() < 0.003) {
      constellation = generateConstellation();
      drawProgress = 0;
      currentLine = 0;
    }

    requestAnimationFrame(animate);
  }
  animate();

  window.addEventListener('resize', () => {
    resize();
    constellation = generateConstellation();
    drawProgress = 0;
    currentLine = 0;
  });
</script>
</body>
</html>
