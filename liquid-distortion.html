<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Distortion</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050510; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.12); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Liquid Distortion · perlin-style flow</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const COLS = 60;
  const ROWS = 40;
  const grid = [];
  const baseGrid = [];

  const cx = W / 2;
  const cy = H / 2;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = (c / COLS) * W;
      const y = (r / ROWS) * H;
      baseGrid.push({ x, y });
      grid.push({ x, y, ox: x, oy: y });
    }
  }

  let time = 0;
  const mouse = { x: W/2, y: H/2, px: W/2, py: H/2 };

  document.addEventListener('mousemove', (e) => {
    mouse.px = mouse.x;
    mouse.py = mouse.y;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  const colors = [
    [110, 68, 255],
    [255, 107, 107],
    [107, 203, 255],
    [255, 217, 61],
    [255, 107, 181],
    [68, 255, 161],
  ];

  function animate() {
    time += 0.008;
    ctx.fillStyle = 'rgba(5, 5, 16, 0.08)';
    ctx.fillRect(0, 0, W, H);

    const dx = mouse.x - mouse.px;
    const dy = mouse.y - mouse.py;

    for (let i = 0; i < grid.length; i++) {
      const g = grid[i];
      const b = baseGrid[i];

      const distToMouse = Math.sqrt((g.x - mouse.x) ** 2 + (g.y - mouse.y) ** 2);
      const mouseInfluence = Math.max(0, 1 - distToMouse / 250);
      const angle = Math.atan2(g.y - mouse.y, g.x - mouse.x);

      const waveX = Math.sin(time + b.y * 0.01) * 15;
      const waveY = Math.cos(time * 0.8 + b.x * 0.012) * 12;
      const wave2 = Math.sin(time * 1.3 + b.x * 0.02 + b.y * 0.015) * 8;
      const wave3 = Math.cos(time * 0.6 + b.y * 0.025 - b.x * 0.01) * 6;

      g.x += (b.x + waveX + wave2 + wave3 + Math.cos(angle) * mouseInfluence * 30 - g.x) * 0.05;
      g.y += (b.y + waveY + wave2 + wave3 + Math.sin(angle) * mouseInfluence * 30 - g.y) * 0.05;

      const hue = (240 + Math.sin(time * 0.3 + b.x * 0.005 + b.y * 0.005) * 60) % 360;
      const alpha = 0.15 + mouseInfluence * 0.5;

      ctx.beginPath();
      ctx.arc(g.x, g.y, 1.5 + mouseInfluence * 4, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${alpha})`;
      ctx.fill();

      for (let j = i + 1; j < grid.length; j++) {
        const g2 = grid[j];
        const d = Math.sqrt((g.x - g2.x) ** 2 + (g.y - g2.y) ** 2);
        if (d < 80) {
          const a = (1 - d / 80) * 0.15;
          ctx.beginPath();
          ctx.moveTo(g.x, g.y);
          ctx.lineTo(g2.x, g2.y);
          ctx.strokeStyle = `hsla(${hue}, 70%, 60%, ${a})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
