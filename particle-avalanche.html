<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Avalanche</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0808; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.06); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Avalanche · cascading rubble</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const rocks = [];
  const MAX = 300;

  function spawnRock() {
    if (rocks.length >= MAX) return;
    const size = 3 + Math.random() * 8;
    rocks.push({
      x: Math.random() * W,
      y: -size - Math.random() * 20,
      vx: (Math.random() - 0.5) * 2,
      vy: 2 + Math.random() * 4,
      size,
      hue: 30 + Math.random() * 20,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.05,
      alpha: 0.6 + Math.random() * 0.3,
      phase: Math.random() * Math.PI * 2,
    });
  }

  for (let i = 0; i < 50; i++) spawnRock();

  let time = 0;

  function animate() {
    time += 0.005;
    ctx.fillStyle = 'rgba(10, 8, 8, 0.03)';
    ctx.fillRect(0, 0, W, H);

    if (Math.random() < 0.15) spawnRock();

    for (let i = rocks.length - 1; i >= 0; i--) {
      const r = rocks[i];
      r.vy += 0.02;
      r.vx += Math.sin(time + r.phase + r.y * 0.01) * 0.005;
      r.x += r.vx;
      r.y += r.vy;
      r.rotation += r.rotSpeed;

      if (r.y > H + r.size * 2) { rocks.splice(i, 1); continue; }

      ctx.save();
      ctx.translate(r.x, r.y);
      ctx.rotate(r.rotation);

      const shade = 30 + Math.sin(time + r.phase) * 10;
      ctx.fillStyle = `hsla(${r.hue}, 30%, ${shade}%, ${r.alpha})`;
      ctx.strokeStyle = `hsla(${r.hue}, 20%, ${shade + 10}%, ${r.alpha * 0.5})`;
      ctx.lineWidth = 0.5;

      const s = r.size;
      ctx.beginPath();
      const sides = 4 + Math.floor(Math.random() * 3 + 3);
      for (let j = 0; j < sides; j++) {
        const a = (j / sides) * Math.PI * 2;
        const rad = s * (0.7 + Math.sin(j * 2.5 + r.phase) * 0.3);
        j === 0 ? ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad) : ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
