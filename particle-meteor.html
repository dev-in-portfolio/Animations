<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Meteor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #04040a; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.06); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Meteor · atmospheric burn</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const meteors = [];
  const TRAIL = 40;

  function createMeteor() {
    const x = Math.random() * W;
    const y = -20;
    const angle = Math.PI * 0.75 + Math.random() * Math.PI * 0.15;
    const speed = 6 + Math.random() * 5;
    meteors.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      trail: [],
      size: 2 + Math.random() * 2,
      hue: 30 + Math.random() * 20,
      life: 1,
    });
  }

  for (let i = 0; i < 3; i++) createMeteor();

  let time = 0;

  function animate() {
    time += 0.005;
    ctx.fillStyle = 'rgba(4, 4, 10, 0.06)';
    ctx.fillRect(0, 0, W, H);

    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.x += m.vx;
      m.y += m.vy;
      m.life -= 0.003;
      m.trail.push({ x: m.x, y: m.y });
      if (m.trail.length > TRAIL) m.trail.shift();

      if (m.x < -100 || m.x > W + 100 || m.y > H + 100 || m.life <= 0) {
        meteors.splice(i, 1);
        continue;
      }

      for (let t = 0; t < m.trail.length; t++) {
        const frac = t / m.trail.length;
        const alpha = frac * m.life * 0.5;
        const size = m.size * frac;
        const hue = m.hue + (1 - frac) * 30;
        ctx.beginPath();
        ctx.arc(m.trail[t].x, m.trail[t].y, size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${hue}, 100%, ${40 + frac * 40}%, ${alpha})`;
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(m.x, m.y, m.size * 1.5, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${m.hue}, 100%, 85%, ${m.life})`;
      ctx.fill();

      const grad = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 20);
      grad.addColorStop(0, `hsla(${m.hue + 10}, 100%, 80%, ${m.life * 0.08})`);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(m.x, m.y, 20, 0, Math.PI * 2);
      ctx.fill();
    }

    if (Math.random() < 0.01) createMeteor();

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
