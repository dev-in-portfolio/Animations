<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Comet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050510; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.08); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Comet · streaking tails</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const comets = [];
  const TRAIL_LENGTH = 50;

  function createComet() {
    const side = Math.floor(Math.random() * 4);
    let x, y, vx, vy;
    const speed = 3 + Math.random() * 4;
    const angle = Math.random() * Math.PI * 0.5 - Math.PI * 0.25;
    switch (side) {
      case 0: x = Math.random() * W; y = -10; vx = Math.cos(angle) * speed; vy = Math.sin(angle) * speed + 1; break;
      case 1: x = W + 10; y = Math.random() * H; vx = -(Math.cos(angle) * speed + 1); vy = Math.sin(angle) * speed; break;
      case 2: x = Math.random() * W; y = H + 10; vx = Math.cos(angle) * speed; vy = -(Math.sin(angle) * speed + 1); break;
      case 3: x = -10; y = Math.random() * H; vx = Math.cos(angle) * speed + 1; vy = Math.sin(angle) * speed; break;
    }
    comets.push({
      x, y, vx, vy,
      trail: [],
      hue: 200 + Math.random() * 60,
      size: 2 + Math.random() * 2,
      life: 1,
    });
  }

  for (let i = 0; i < 6; i++) createComet();
  setInterval(createComet, 2000 + Math.random() * 3000);

  let time = 0;

  function animate() {
    time += 0.004;
    ctx.fillStyle = 'rgba(5, 5, 16, 0.05)';
    ctx.fillRect(0, 0, W, H);

    for (let i = comets.length - 1; i >= 0; i--) {
      const c = comets[i];
      c.x += c.vx;
      c.y += c.vy;
      c.life -= 0.001;
      c.trail.push({ x: c.x, y: c.y });
      if (c.trail.length > TRAIL_LENGTH) c.trail.shift();

      if (c.x < -100 || c.x > W + 100 || c.y < -100 || c.y > H + 100 || c.life <= 0) {
        comets.splice(i, 1);
        continue;
      }

      for (let t = 0; t < c.trail.length; t++) {
        const tp = c.trail[t];
        const alpha = (t / c.trail.length) * 0.4;
        const size = c.size * (t / c.trail.length);
        ctx.beginPath();
        ctx.arc(tp.x, tp.y, size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${c.hue}, 80%, 65%, ${alpha})`;
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(c.x, c.y, c.size * 1.5, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${c.hue}, 90%, 80%, 0.8)`;
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
