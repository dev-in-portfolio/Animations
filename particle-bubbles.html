<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Bubbles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0e1a; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.1); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Bubbles · click to add</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const bubbles = [];
  const mouse = { x: W/2, y: H/2, active: false };

  document.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
  document.addEventListener('mouseleave', () => { mouse.active = false; });

  function createBubble(x, y) {
    const size = 15 + Math.random() * 40;
    bubbles.push({
      x, y,
      size,
      maxSize: size,
      vy: -(0.2 + Math.random() * 0.5),
      vx: (Math.random() - 0.5) * 0.3,
      hue: 200 + Math.random() * 60,
      phase: Math.random() * Math.PI * 2,
      wobble: 0.5 + Math.random() * 1,
      life: 1,
      pop: false,
      popProgress: 0,
    });
  }

  for (let i = 0; i < 12; i++) {
    createBubble(Math.random() * W, H * 0.5 + Math.random() * H * 0.5);
  }

  document.addEventListener('click', (e) => {
    for (let i = 0; i < 5; i++) {
      createBubble(
        e.clientX + (Math.random() - 0.5) * 60,
        e.clientY + (Math.random() - 0.5) * 60
      );
    }
  });

  let time = 0;

  function animate() {
    time += 0.005;
    ctx.fillStyle = 'rgba(10, 14, 26, 0.03)';
    ctx.fillRect(0, 0, W, H);

    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];

      if (b.pop) {
        b.popProgress += 0.05;
        if (b.popProgress >= 1) { bubbles.splice(i, 1); continue; }
        const r = b.size * (1 + b.popProgress * 2);
        ctx.beginPath();
        ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
        ctx.strokeStyle = `hsla(${b.hue}, 80%, 70%, ${(1 - b.popProgress) * 0.2})`;
        ctx.lineWidth = 1;
        ctx.stroke();
        continue;
      }

      b.x += b.vx + Math.sin(time * b.wobble + b.phase) * 0.2;
      b.y += b.vy;

      if (mouse.active) {
        const dx = b.x - mouse.x;
        const dy = b.y - mouse.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < 120) {
          const force = (1 - d / 120) * 0.5;
          b.vx += (dx / d) * force;
          b.vy += (dy / d) * force;
        }
      }

      b.vx *= 0.999;
      b.size = b.maxSize * (0.9 + Math.sin(time + b.phase) * 0.1);

      if (b.y < -b.size) { bubbles.splice(i, 1); continue; }

      if (Math.random() < 0.0005) { b.pop = true; continue; }

      ctx.beginPath();
      ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
      ctx.strokeStyle = `hsla(${b.hue + Math.sin(time + b.phase) * 15}, 70%, 65%, 0.25)`;
      ctx.lineWidth = 1;
      ctx.stroke();

      const grad = ctx.createRadialGradient(
        b.x - b.size * 0.3, b.y - b.size * 0.3, 0,
        b.x, b.y, b.size
      );
      grad.addColorStop(0, `hsla(${b.hue}, 80%, 75%, 0.08)`);
      grad.addColorStop(0.5, `hsla(${b.hue + 20}, 70%, 60%, 0.03)`);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(b.x - b.size * 0.25, b.y - b.size * 0.25, b.size * 0.15, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(0, 0%, 100%, ${0.1 + Math.sin(time + b.phase) * 0.05})`;
      ctx.fill();
    }

    if (Math.random() < 0.02) {
      createBubble(Math.random() * W, H + 10);
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
