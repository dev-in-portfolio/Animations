<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snowfall</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0e14; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.1); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Snowfall · winter drift</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const flakes = [];
  const COUNT = 200;

  for (let i = 0; i < COUNT; i++) {
    flakes.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 1 + Math.random() * 3,
      speed: 0.2 + Math.random() * 0.6,
      wind: (Math.random() - 0.5) * 0.3,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.2 + Math.random() * 0.5,
      alpha: 0.3 + Math.random() * 0.6,
      opacity: 0.3 + Math.random() * 0.7,
    });
  }

  let time = 0;

  function animate() {
    time += 0.005;
    ctx.fillStyle = 'rgba(10, 14, 20, 0.03)';
    ctx.fillRect(0, 0, W, H);

    for (const f of flakes) {
      f.y += f.speed;
      f.x += f.wind + Math.sin(time * f.wobbleSpeed + f.wobble) * 0.2;

      if (f.y > H + 5) {
        f.y = -5;
        f.x = Math.random() * W;
      }
      if (f.x < -5) f.x = W + 5;
      if (f.x > W + 5) f.x = -5;

      const alpha = f.alpha * (0.7 + Math.sin(time * f.wobbleSpeed + f.wobble) * 0.3);

      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(220, 230, 250, ${alpha * 0.8})`;
      ctx.fill();

      if (f.r > 2) {
        ctx.beginPath();
        ctx.arc(f.x - f.r * 0.3, f.y - f.r * 0.3, f.r * 1.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220, 230, 250, ${alpha * 0.08})`;
        ctx.fill();
      }
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
