<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Circuit</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.1); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Circuit · flowing paths</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const nodes = 25;
  const points = [];
  const connections = [];

  for (let i = 0; i < nodes; i++) {
    points.push({
      x: 40 + Math.random() * (W - 80),
      y: 40 + Math.random() * (H - 80),
      connections: [],
    });
  }

  for (let i = 0; i < nodes; i++) {
    for (let j = i + 1; j < nodes; j++) {
      const dx = points[i].x - points[j].x;
      const dy = points[i].y - points[j].y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < 200 && Math.random() < 0.25) {
        connections.push({ from: i, to: j });
        points[i].connections.push(j);
        points[j].connections.push(i);
      }
    }
  }

  const particles = [];
  const PARTICLE_COUNT = 30;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const conn = connections[Math.floor(Math.random() * connections.length)];
    const from = points[conn.from];
    const to = points[conn.to];
    const t = Math.random();
    particles.push({
      x: from.x + (to.x - from.x) * t,
      y: from.y + (to.y - from.y) * t,
      targetNode: t < 0.5 ? conn.to : conn.from,
      currentNode: t < 0.5 ? conn.from : conn.to,
      progress: t < 0.5 ? t : 1 - t,
      speed: 0.005 + Math.random() * 0.01,
      hue: 200 + Math.random() * 60,
      size: 2 + Math.random() * 2,
      phase: Math.random() * Math.PI * 2,
    });
  }

  let time = 0;

  function animate() {
    time += 0.004;
    ctx.fillStyle = 'rgba(10, 10, 15, 0.04)';
    ctx.fillRect(0, 0, W, H);

    for (const conn of connections) {
      const a = points[conn.from];
      const b = points[conn.to];
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = `hsla(220, 40%, 30%, 0.04)`;
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }

    for (const p of particles) {
      p.progress += p.speed;
      if (p.progress >= 1) {
        p.progress = 0;
        const neighbors = points[p.targetNode].connections;
        if (neighbors.length > 0) {
          const next = neighbors[Math.floor(Math.random() * neighbors.length)];
          p.currentNode = p.targetNode;
          p.targetNode = next;
        }
      }

      const from = points[p.currentNode];
      const to = points[p.targetNode];
      const ease = 1 - Math.pow(1 - p.progress, 2);
      p.x = from.x + (to.x - from.x) * ease;
      p.y = from.y + (to.y - from.y) * ease;

      const alpha = 0.3 + Math.sin(p.progress * Math.PI) * 0.5;
      const hue = p.hue + Math.sin(time + p.phase) * 15;
      const size = p.size * (0.5 + Math.sin(p.progress * Math.PI) * 0.5);

      ctx.beginPath();
      ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, 80%, 65%, ${alpha})`;
      ctx.fill();

      if (alpha > 0.5) {
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 5);
        grad.addColorStop(0, `hsla(${hue}, 80%, 70%, ${alpha * 0.06})`);
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, size * 5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
