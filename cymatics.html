<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cymatics</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050510; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.1); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Cymatics · vibrational wave patterns</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const cx = W / 2;
  const cy = H / 2;
  let time = 0;
  const mouse = { x: cx, y: cy };

  document.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  function animate() {
    time += 0.005;
    ctx.fillStyle = 'rgba(5, 5, 16, 0.04)';
    ctx.fillRect(0, 0, W, H);

    const centerX = cx + (mouse.x - cx) * 0.03;
    const centerY = cy + (mouse.y - cy) * 0.03;

    for (let ring = 0; ring < 6; ring++) {
      const baseRadius = 30 + ring * 35;
      const freq = 1.2 + ring * 0.3;
      const points = 40 + ring * 8;

      ctx.beginPath();
      for (let i = 0; i <= points; i++) {
        const angle = (i / points) * Math.PI * 2;
        const wave = Math.sin(angle * freq + time * (1 + ring * 0.2)) * 8;
        const wave2 = Math.sin(angle * (freq * 1.5) + time * 0.7) * 4;
        const wave3 = Math.cos(angle * 2 + time * 0.5 + ring) * 3;
        const r = baseRadius + wave + wave2 + wave3;
        const x = centerX + Math.cos(angle) * r;
        const y = centerY + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();

      const hue = 200 + ring * 15 + Math.sin(time * 0.3 + ring) * 20;
      const alpha = 0.1 + Math.sin(time * 0.5 + ring * 0.7) * 0.05;

      ctx.strokeStyle = `hsla(${hue}, 80%, 60%, ${alpha})`;
      ctx.lineWidth = 0.5 + ring * 0.2;
      ctx.stroke();
    }

    for (let i = 0; i < 80; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 20 + Math.random() * 200;
      const wave = Math.sin(dist * 0.05 + time * 2) * 5;
      const x = centerX + Math.cos(angle) * (dist + wave);
      const y = centerY + Math.sin(angle) * (dist + wave);
      const hue = 220 + dist * 0.2 + Math.sin(time + dist * 0.02) * 20;
      ctx.beginPath();
      ctx.arc(x, y, 0.5 + Math.sin(dist * 0.1 + time * 3) * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, 80%, 60%, 0.15)`;
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
