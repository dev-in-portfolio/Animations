<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Tsunami</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #060e12; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.06); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Tsunami · wall of water</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const particles = [];
  const WAVE_COUNT = 3;
  const DROPLETS = 200;

  for (let w = 0; w < WAVE_COUNT; w++) {
    const baseX = -100 + w * 250;
    const peakH = 80 + w * 40;
    for (let i = 0; i < DROPLETS; i++) {
      const t = Math.random();
      const x = baseX + t * 300;
      const h = Math.sin(t * Math.PI) * peakH;
      particles.push({
        x, y: H - h - 30 + (Math.random() - 0.5) * 15,
        baseX: x,
        baseY: H - h - 30,
        waveIdx: w,
        vx: 0.3 + w * 0.2 + Math.random() * 0.1,
        vy: (Math.random() - 0.5) * 0.2,
        size: 2 + Math.random() * 4,
        hue: 200 + Math.random() * 30,
        alpha: 0.3 + Math.random() * 0.4,
        phase: Math.random() * Math.PI * 2,
        spray: Math.random() > 0.8,
      });
    }
  }

  let time = 0;

  function animate() {
    time += 0.004;
    ctx.fillStyle = 'rgba(6, 14, 18, 0.03)';
    ctx.fillRect(0, 0, W, H);

    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy + Math.sin(time + p.phase + p.x * 0.01) * 0.1;

      const roll = Math.sin(time * 0.2 + p.waveIdx * 0.5 + p.baseX * 0.01) * 10;
      const targetY = p.baseY + roll;
      p.y += (targetY - p.y) * 0.005;

      if (p.x > W + 50) {
        p.x = p.baseX;
        p.y = targetY;
      }

      const alpha = p.alpha * (0.6 + Math.sin(time + p.phase) * 0.4);
      const hue = p.hue + Math.sin(time * 0.5 + p.phase) * 10;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, 60%, ${45 + Math.sin(time + p.phase) * 10}%, ${alpha})`;
      ctx.fill();

      if (p.spray && Math.random() < 0.01) {
        ctx.beginPath();
        ctx.arc(p.x + (Math.random() - 0.5) * 10, p.y - 5, p.size * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(210, 50%, 70%, ${alpha * 0.3})`;
        ctx.fill();
      }
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
