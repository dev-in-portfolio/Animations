<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Bloom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #080810; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.08); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Bloom · click to plant</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const flowers = [];

  function createFlower(x, y) {
    const petals = 8 + Math.floor(Math.random() * 8);
    const size = 30 + Math.random() * 40;
    const hue = Math.random() * 360;
    const particles = [];
    for (let i = 0; i < petals; i++) {
      const angle = (i / petals) * Math.PI * 2;
      const pLen = size * (0.6 + Math.random() * 0.4);
      const pWidth = 3 + Math.random() * 5;
      particles.push({ angle, pLen, pWidth, phase: Math.random() * Math.PI * 2 });
    }
    flowers.push({ x, y, particles, size, hue, progress: 0, phase: Math.random() * Math.PI * 2 });
  }

  for (let i = 0; i < 5; i++) {
    createFlower(Math.random() * W, Math.random() * H);
  }

  document.addEventListener('click', (e) => {
    createFlower(e.clientX, e.clientY);
  });

  let time = 0;

  function animate() {
    time += 0.004;
    ctx.fillStyle = 'rgba(8, 8, 16, 0.02)';
    ctx.fillRect(0, 0, W, H);

    for (let f = flowers.length - 1; f >= 0; f--) {
      const flower = flowers[f];
      flower.progress = Math.min(1, flower.progress + 0.003);
      if (flowers.length > 20) { flowers.splice(f, 1); continue; }

      const bloom = 0.3 + Math.sin(time * 0.5 + flower.phase) * 0.2 + flower.progress * 0.5;

      for (const p of flower.particles) {
        const a = p.angle + time * 0.02;
        const r = p.pLen * bloom;
        const x = flower.x + Math.cos(a) * r;
        const y = flower.y + Math.sin(a) * r;

        const hue = flower.hue + Math.sin(time + p.phase) * 20;
        const alpha = 0.15 + bloom * 0.35;
        const size = p.pWidth * (0.3 + bloom * 0.7);

        ctx.beginPath();
        ctx.ellipse(x, y, size, size * 0.5, a, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${hue}, 80%, ${50 + bloom * 25}%, ${alpha})`;
        ctx.fill();
      }

      const cx = flower.x;
      const cy = flower.y;
      const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 8);
      coreGrad.addColorStop(0, `hsla(${flower.hue + 30}, 90%, 80%, ${bloom * 0.4})`);
      coreGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = coreGrad;
      ctx.beginPath();
      ctx.arc(cx, cy, 8, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
