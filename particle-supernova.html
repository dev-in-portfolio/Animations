<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Supernova</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #020208; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.06); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Supernova · stellar explosion</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const cx = W / 2;
  const cy = H / 2;
  const particles = [];
  const SHELLS = 5;
  const PER_SHELL = 200;

  for (let s = 0; s < SHELLS; s++) {
    const baseSpeed = 1 + s * 1.5;
    const hueBase = 30 + s * 20;
    for (let i = 0; i < PER_SHELL; i++) {
      const theta = Math.acos(2 * Math.random() - 1);
      const phi = Math.random() * Math.PI * 2;
      const speed = baseSpeed + (Math.random() - 0.5) * 1.5;
      particles.push({
        x: cx, y: cy,
        vx: Math.sin(theta) * Math.cos(phi) * speed,
        vy: Math.sin(theta) * Math.sin(phi) * speed,
        size: 1.5 + Math.random() * 3,
        hue: hueBase + Math.random() * 30,
        alpha: 0.8 - s * 0.1,
        life: 1,
        decay: 0.003 + Math.random() * 0.004,
        phase: Math.random() * Math.PI * 2,
        trail: [],
      });
    }
  }

  let time = 0;
  let flash = 1;

  function animate() {
    time += 0.005;
    flash *= 0.97;

    ctx.fillStyle = `rgba(2, 2, 8, 0.04)`;
    ctx.fillRect(0, 0, W, H);

    if (flash > 0.01) {
      ctx.fillStyle = `rgba(255, 220, 180, ${flash * 0.08})`;
      ctx.fillRect(0, 0, W, H);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vx *= 0.995;
      p.vy *= 0.995;
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      p.size *= 0.998;
      p.trail.push({ x: p.x, y: p.y });
      if (p.trail.length > 15) p.trail.shift();

      if (p.life <= 0) { particles.splice(i, 1); continue; }

      for (let t = 0; t < p.trail.length; t++) {
        const f = t / p.trail.length;
        ctx.beginPath();
        ctx.arc(p.trail[t].x, p.trail[t].y, p.size * f * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${p.hue}, 100%, ${50 + f * 40}%, ${p.life * f * 0.15})`;
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue}, 100%, 70%, ${p.life * p.alpha})`;
      ctx.fill();

      if (p.life > 0.5) {
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 6);
        grad.addColorStop(0, `hsla(${p.hue + 20}, 100%, 70%, ${p.life * 0.04})`);
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 6, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (particles.length > 0) requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
