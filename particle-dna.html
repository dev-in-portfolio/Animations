<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle DNA</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #060612; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.1); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">DNA · rotating double helix</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const cx = W / 2;
  const cy = H / 2;
  const BASE_PAIRS = 30;
  const RADIUS = 80;
  const STRETCH = 6;
  const particles = [];

  for (let i = 0; i < BASE_PAIRS; i++) {
    const t = i / BASE_PAIRS;
    const y = -180 + t * 360;
    const hue = 200 + t * 120;
    for (let side = 0; side < 2; side++) {
      particles.push({
        baseAngle: Math.PI * 2 * t + side * Math.PI,
        y,
        hue: side === 0 ? hue : hue + 40,
        size: 3 + Math.random() * 2,
        rungPhase: Math.random() * Math.PI * 2,
        side,
      });
    }
  }

  let time = 0;

  function animate() {
    time += 0.008;
    ctx.fillStyle = 'rgba(6, 6, 18, 0.04)';
    ctx.fillRect(0, 0, W, H);

    const angleOffset = time * 0.5;

    for (const p of particles) {
      const a = p.baseAngle + angleOffset;
      const x = cx + Math.cos(a) * RADIUS;
      const z = Math.sin(a) * RADIUS;
      const depthScale = 0.3 + (z / RADIUS) * 0.3 + 0.5;
      const y = cy + p.y + Math.sin(time * 0.3 + p.rungPhase) * 8;

      const alpha = 0.2 + depthScale * 0.5;
      const size = p.size * depthScale;
      const hue = p.hue + Math.sin(time + p.rungPhase) * 10;

      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, 80%, ${45 + depthScale * 30}%, ${alpha})`;
      ctx.fill();

      const grad = ctx.createRadialGradient(x, y, 0, x, y, size * 3);
      grad.addColorStop(0, `hsla(${hue + 20}, 80%, 65%, ${alpha * 0.12})`);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, size * 3, 0, Math.PI * 2);
      ctx.fill();
    }

    if (Math.floor(time * 10) % 3 === 0) {
      for (let i = 0; i < BASE_PAIRS; i++) {
        const t = i / BASE_PAIRS;
        const a1 = Math.PI * 2 * t + angleOffset;
        const x1 = cx + Math.cos(a1) * RADIUS;
        const y1 = cy + -180 + t * 360;
        const a2 = a1 + Math.PI;
        const x2 = cx + Math.cos(a2) * RADIUS;
        const y2 = cy + -180 + t * 360;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = `hsla(${200 + t * 100}, 70%, 55%, 0.08)`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
