<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Spiral</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a12; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.12); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Particle Spiral · click to burst</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const particles = [];
  const COUNT = 500;

  const centerX = W / 2;
  const centerY = H / 2;

  for (let i = 0; i < COUNT; i++) {
    const t = i / COUNT;
    const angle = t * Math.PI * 12;
    const radius = t * Math.min(W, H) * 0.45;
    particles.push({
      angle,
      radius,
      baseRadius: radius,
      speed: 0.002 + Math.random() * 0.004,
      orbitSpeed: 0.002 + Math.random() * 0.006,
      size: 1 + Math.random() * 2.5,
      hue: 200 + t * 120 + Math.random() * 30,
      scatter: Math.random() * 100,
      scatterSpeed: 0.5 + Math.random() * 1,
    });
  }

  let time = 0;
  let burst = 0;
  let burstParticles = [];

  document.addEventListener('click', (e) => {
    burst = 1;
    for (let i = 0; i < 60; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 6;
      burstParticles.push({
        x: e.clientX,
        y: e.clientY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        size: 2 + Math.random() * 4,
        hue: Math.random() * 60 + 200,
      });
    }
  });

  function animate() {
    time += 0.01;
    ctx.fillStyle = 'rgba(10, 10, 18, 0.08)';
    ctx.fillRect(0, 0, W, H);

    for (const p of particles) {
      p.radius = p.baseRadius + Math.sin(time * p.speed * 3 + p.angle) * 15;
      p.angle += p.orbitSpeed;

      const x = centerX + Math.cos(p.angle) * p.radius + Math.sin(time * p.scatterSpeed + p.scatter) * 2;
      const y = centerY + Math.sin(p.angle) * p.radius + Math.cos(time * p.scatterSpeed * 0.7 + p.scatter) * 2;

      const alpha = 0.3 + Math.sin(time + p.angle) * 0.2;
      ctx.beginPath();
      ctx.arc(x, y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue + Math.sin(time + p.angle) * 10}, 75%, 65%, ${alpha})`;
      ctx.fill();
    }

    for (let i = burstParticles.length - 1; i >= 0; i--) {
      const bp = burstParticles[i];
      bp.x += bp.vx;
      bp.y += bp.vy;
      bp.vy += 0.05;
      bp.vx *= 0.99;
      bp.life -= 0.015;
      bp.size *= 0.995;

      if (bp.life <= 0) { burstParticles.splice(i, 1); continue; }

      ctx.beginPath();
      ctx.arc(bp.x, bp.y, bp.size * bp.life, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${bp.hue}, 80%, 70%, ${bp.life * 0.8})`;
      ctx.fill();
    }

    burst = Math.max(0, burst - 0.01);
    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
