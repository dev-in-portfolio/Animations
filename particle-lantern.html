<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Lantern</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #080612; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.08); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Lantern · floating lights</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const lanterns = [];

  function createLantern() {
    const hue = 30 + Math.random() * 30;
    lanterns.push({
      x: Math.random() * W,
      y: H + 20,
      size: 15 + Math.random() * 20,
      vy: -(0.3 + Math.random() * 0.5),
      vx: (Math.random() - 0.5) * 0.2,
      hue,
      phase: Math.random() * Math.PI * 2,
      wobble: 0.5 + Math.random() * 1,
      glow: 0.6 + Math.random() * 0.4,
      drift: (Math.random() - 0.5) * 0.3,
    });
  }

  for (let i = 0; i < 10; i++) createLantern();

  let time = 0;

  function animate() {
    time += 0.004;
    ctx.fillStyle = 'rgba(8, 6, 18, 0.03)';
    ctx.fillRect(0, 0, W, H);

    for (let i = lanterns.length - 1; i >= 0; i--) {
      const l = lanterns[i];
      l.x += l.vx + Math.sin(time * l.wobble + l.phase) * 0.3 + l.drift;
      l.y += l.vy;
      l.vy *= 0.999;
      l.vx += Math.sin(time * 0.5 + l.phase) * 0.002;

      if (l.y < -l.size * 3) { lanterns.splice(i, 1); continue; }

      const flicker = 0.85 + Math.sin(time * 3 + l.phase) * 0.15;
      const alpha = 0.15 + flicker * 0.15;

      for (let r = 0; r < 3; r++) {
        const rad = l.size * (0.3 + r * 0.35);
        ctx.beginPath();
        ctx.arc(l.x, l.y, rad, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${l.hue + r * 10}, 90%, ${55 + r * 15}%, ${alpha / (r + 1)})`;
        ctx.fill();
      }

      const grad = ctx.createRadialGradient(l.x, l.y - l.size * 0.2, 0, l.x, l.y, l.size * 3);
      grad.addColorStop(0, `hsla(${l.hue}, 100%, 70%, ${flicker * 0.04})`);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(l.x, l.y, l.size * 3, 0, Math.PI * 2);
      ctx.fill();
    }

    if (Math.random() < 0.01) createLantern();

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
