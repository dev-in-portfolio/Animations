<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Swarm</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a12; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.1); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Swarm · flocking behavior</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const BOIDS = 80;
  const boids = [];

  for (let i = 0; i < BOIDS; i++) {
    boids.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2,
      hue: 200 + Math.random() * 60,
      size: 2 + Math.random() * 2,
      phase: Math.random() * Math.PI * 2,
    });
  }

  const mouse = { x: W/2, y: H/2, active: false };
  document.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
  document.addEventListener('mouseleave', () => { mouse.active = false; });

  function dist(a, b) {
    return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
  }

  let time = 0;

  function animate() {
    time += 0.003;
    ctx.fillStyle = 'rgba(10, 10, 18, 0.06)';
    ctx.fillRect(0, 0, W, H);

    for (const b of boids) {
      let ax = 0, ay = 0;
      let alignX = 0, alignY = 0;
      let cohesionX = 0, cohesionY = 0;
      let sepX = 0, sepY = 0;
      let neighbors = 0;
      let mouseD = mouse.active ? dist(b, mouse) : Infinity;

      if (mouseD < 100) {
        const force = (1 - mouseD / 100) * 2;
        ax += (b.x - mouse.x) / mouseD * force;
        ay += (b.y - mouse.y) / mouseD * force;
      }

      for (const other of boids) {
        if (other === b) continue;
        const d = dist(b, other);
        if (d < 120) {
          alignX += other.vx;
          alignY += other.vy;
          cohesionX += other.x;
          cohesionY += other.y;
          if (d < 25) {
            sepX += (b.x - other.x) / d;
            sepY += (b.y - other.y) / d;
          }
          neighbors++;
        }
      }

      if (neighbors > 0) {
        ax += (alignX / neighbors - b.vx) * 0.02;
        ay += (alignY / neighbors - b.vy) * 0.02;
        ax += (cohesionX / neighbors - b.x) * 0.003;
        ay += (cohesionY / neighbors - b.y) * 0.003;
      }

      ax += sepX * 0.05;
      ay += sepY * 0.05;

      if (b.x < 40) ax += 0.3;
      if (b.x > W - 40) ax -= 0.3;
      if (b.y < 40) ay += 0.3;
      if (b.y > H - 40) ay -= 0.3;

      b.vx += ax;
      b.vy += ay;
      const speed = Math.sqrt(b.vx ** 2 + b.vy ** 2);
      if (speed > 3) { b.vx *= 3 / speed; b.vy *= 3 / speed; }
      if (speed < 0.5) { b.vx += (Math.random() - 0.5) * 0.1; b.vy += (Math.random() - 0.5) * 0.1; }

      b.x += b.vx;
      b.y += b.vy;

      const hue = b.hue + Math.sin(time + b.phase) * 15;
      const alpha = 0.5 + (speed / 3) * 0.3;

      ctx.beginPath();
      const angle = Math.atan2(b.vy, b.vx);
      ctx.moveTo(b.x + Math.cos(angle) * 6, b.y + Math.sin(angle) * 6);
      ctx.lineTo(b.x - Math.cos(angle - 0.5) * 3, b.y - Math.sin(angle - 0.5) * 3);
      ctx.lineTo(b.x - Math.cos(angle + 0.5) * 3, b.y - Math.sin(angle + 0.5) * 3);
      ctx.closePath();
      ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${alpha})`;
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
