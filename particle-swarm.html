<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Swarm</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a12; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.16); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Swarm · flocking behavior</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const EPSILON = 0.0001;
  let W = 0;
  let H = 0;
  let dpr = 1;
  let resizeTimer;
  let rafId = 0;
  let lastTime = performance.now();

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = `${W}px`;
    canvas.style.height = `${H}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  resize();
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      resize();
      restartAnimation();
    }, 100);
  });

  const BOIDS = 80;
  const boids = [];

  for (let i = 0; i < BOIDS; i++) {
    boids.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2,
      hue: 200 + Math.random() * 60,
      size: 2 + Math.random() * 2,
      phase: Math.random() * Math.PI * 2,
    });
  }

  const pointer = { x: W / 2, y: H / 2, active: false };
  canvas.addEventListener('pointermove', (event) => {
    pointer.x = event.clientX;
    pointer.y = event.clientY;
    pointer.active = true;
  });
  canvas.addEventListener('pointerleave', () => { pointer.active = false; });
  canvas.addEventListener('pointercancel', () => { pointer.active = false; });

  function renderFrame(now) {
    const frameScale = Math.min(Math.max((now - lastTime) / 16.6667, 0.25), 2);
    lastTime = now;
    const time = now * 0.00018;
    const fadeAlpha = 1 - Math.pow(1 - 0.06, frameScale);

    ctx.fillStyle = `rgba(10, 10, 18, ${fadeAlpha})`;
    ctx.fillRect(0, 0, W, H);

    for (const b of boids) {
      let ax = 0, ay = 0;
      let alignX = 0, alignY = 0;
      let cohesionX = 0, cohesionY = 0;
      let sepX = 0, sepY = 0;
      let neighbors = 0;

      if (pointer.active) {
        const dx = b.x - pointer.x;
        const dy = b.y - pointer.y;
        const distSq = dx * dx + dy * dy;
        if (distSq > EPSILON && distSq < 100 * 100) {
          const distance = Math.sqrt(distSq);
          const force = (1 - distance / 100) * 2;
          ax += (dx / distance) * force;
          ay += (dy / distance) * force;
        }
      }

      for (const other of boids) {
        if (other === b) continue;
        const dx = b.x - other.x;
        const dy = b.y - other.y;
        const distSq = dx * dx + dy * dy;

        if (distSq < 120 * 120) {
          alignX += other.vx;
          alignY += other.vy;
          cohesionX += other.x;
          cohesionY += other.y;
          if (distSq > EPSILON && distSq < 25 * 25) {
            const distance = Math.sqrt(distSq);
            sepX += dx / distance;
            sepY += dy / distance;
          }
          neighbors++;
        }
      }

      if (neighbors > 0) {
        ax += (alignX / neighbors - b.vx) * 0.02;
        ay += (alignY / neighbors - b.vy) * 0.02;
        ax += (cohesionX / neighbors - b.x) * 0.003;
        ay += (cohesionY / neighbors - b.y) * 0.003;
      }

      ax += sepX * 0.05;
      ay += sepY * 0.05;

      if (b.x < 40) ax += 0.3;
      if (b.x > W - 40) ax -= 0.3;
      if (b.y < 40) ay += 0.3;
      if (b.y > H - 40) ay -= 0.3;

      b.vx += ax * frameScale;
      b.vy += ay * frameScale;
      const speed = Math.hypot(b.vx, b.vy);
      if (speed > 3) {
        b.vx *= 3 / speed;
        b.vy *= 3 / speed;
      } else if (speed < 0.5) {
        b.vx += (Math.random() - 0.5) * 0.1;
        b.vy += (Math.random() - 0.5) * 0.1;
      }

      b.x += b.vx * frameScale;
      b.y += b.vy * frameScale;

      const hue = b.hue + Math.sin(time + b.phase) * 15;
      const alpha = 0.5 + (Math.min(speed, 3) / 3) * 0.3;
      const angle = Math.atan2(b.vy, b.vx);

      ctx.beginPath();
      ctx.moveTo(b.x + Math.cos(angle) * 6, b.y + Math.sin(angle) * 6);
      ctx.lineTo(b.x - Math.cos(angle - 0.5) * 3, b.y - Math.sin(angle - 0.5) * 3);
      ctx.lineTo(b.x - Math.cos(angle + 0.5) * 3, b.y - Math.sin(angle + 0.5) * 3);
      ctx.closePath();
      ctx.fillStyle = `hsla(${hue}, 80%, 60%, ${alpha})`;
      ctx.fill();
    }
  }

  function animate(now) {
    renderFrame(now);
    if (!reducedMotion.matches && !document.hidden) {
      rafId = requestAnimationFrame(animate);
    }
  }

  function restartAnimation() {
    cancelAnimationFrame(rafId);
    lastTime = performance.now();
    rafId = requestAnimationFrame(animate);
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) restartAnimation();
    else cancelAnimationFrame(rafId);
  });
  reducedMotion.addEventListener('change', restartAnimation);
  restartAnimation();
</script>
</body>
</html>
