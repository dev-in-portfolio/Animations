<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bokeh</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #08080f; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.1); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Bokeh · floating lens light orbs</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const orbs = [];
  const COUNT = 35;

  for (let i = 0; i < COUNT; i++) {
    orbs.push({
      x: Math.random() * W,
      y: Math.random() * H,
      radius: 20 + Math.random() * 80,
      vx: (Math.random() - 0.5) * 0.15,
      vy: (Math.random() - 0.5) * 0.15,
      hue: 200 + Math.random() * 160,
      alpha: 0.03 + Math.random() * 0.06,
      phase: Math.random() * Math.PI * 2,
      pulseSpeed: 0.2 + Math.random() * 0.5,
    });
  }

  const mouse = { x: W/2, y: H/2 };

  document.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  let time = 0;

  function animate() {
    time += 0.002;
    ctx.fillStyle = 'rgba(8, 8, 15, 0.03)';
    ctx.fillRect(0, 0, W, H);

    for (const o of orbs) {
      const dx = mouse.x - o.x;
      const dy = mouse.y - o.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 300) {
        o.vx -= dx * 0.00002;
        o.vy -= dy * 0.00002;
      }

      o.x += o.vx;
      o.y += o.vy;

      if (o.x < -o.radius) o.x = W + o.radius;
      if (o.x > W + o.radius) o.x = -o.radius;
      if (o.y < -o.radius) o.y = H + o.radius;
      if (o.y > H + o.radius) o.y = -o.radius;

      const pulse = 0.8 + Math.sin(time * o.pulseSpeed + o.phase) * 0.2;
      const r = o.radius * pulse;
      const alpha = o.alpha * (0.7 + Math.sin(time * o.pulseSpeed * 0.7 + o.phase) * 0.3);

      const grad = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, r);
      grad.addColorStop(0, `hsla(${o.hue}, 70%, 70%, ${alpha * 0.3})`);
      grad.addColorStop(0.3, `hsla(${o.hue}, 60%, 50%, ${alpha * 0.15})`);
      grad.addColorStop(0.7, `hsla(${o.hue}, 50%, 40%, ${alpha * 0.05})`);
      grad.addColorStop(1, `hsla(${o.hue}, 40%, 30%, 0)`);

      ctx.beginPath();
      ctx.arc(o.x, o.y, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.filter = 'blur(2px)';
      ctx.fill();
      ctx.filter = 'none';
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
