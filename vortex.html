<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortex</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #020208; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.1); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Vortex · spiraling abyss</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const particles = [];
  const COUNT = 500;
  const cx = W / 2;
  const cy = H / 2;

  for (let i = 0; i < COUNT; i++) {
    const t = i / COUNT;
    particles.push({
      angle: t * Math.PI * 8,
      radius: t * Math.max(W, H) * 0.45,
      size: 1 + t * 2,
      hue: 240 + t * 120,
      alpha: 0.3 + t * 0.5,
      speed: 0.2 + t * 0.3,
      z: t,
    });
  }

  let time = 0;

  function animate() {
    time += 0.004;
    ctx.fillStyle = 'rgba(2, 2, 8, 0.03)';
    ctx.fillRect(0, 0, W, H);

    for (const p of particles) {
      p.angle += p.speed * 0.01 + time * 0.001;
      p.radius -= 0.08;

      if (p.radius < 2) {
        p.radius = Math.max(W, H) * 0.45;
        p.angle = Math.random() * Math.PI * 2;
        p.z = Math.random();
        p.size = 1 + p.z * 2;
        p.hue = 240 + p.z * 120;
        p.alpha = 0.3 + p.z * 0.5;
        p.speed = 0.2 + p.z * 0.3;
      }

      const wobble = Math.sin(time * 2 + p.angle * 0.5) * 3;
      const x = cx + Math.cos(p.angle) * (p.radius + wobble);
      const y = cy + Math.sin(p.angle) * (p.radius * 0.5 + wobble * 0.3);

      const alpha = p.alpha * (1 - p.radius / (Math.max(W, H) * 0.45));

      ctx.beginPath();
      ctx.arc(x, y, p.size * (1 - p.z * 0.5), 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue + Math.sin(time + p.angle) * 20}, 80%, 60%, ${Math.max(0, alpha)})`;
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
