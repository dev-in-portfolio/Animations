<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lissajous</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050510; overflow: hidden; height: 100vh; font-family: 'Courier New', monospace; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(0,255,200,0.1); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Lissajous · oscilloscope curves</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const cx = W / 2;
  const cy = H / 2;

  const curves = [];
  for (let i = 0; i < 5; i++) {
    curves.push({
      a: 2 + Math.floor(Math.random() * 5),
      b: 3 + Math.floor(Math.random() * 5),
      delta: Math.random() * Math.PI * 2,
      amp: 40 + i * 30,
      hue: 140 + i * 30,
      alpha: 0.04 + i * 0.02,
      phase: Math.random() * Math.PI * 2,
    });
  }

  let time = 0;
  const mouse = { x: cx, y: cy };

  document.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  function animate() {
    time += 0.003;
    ctx.fillStyle = 'rgba(5, 5, 16, 0.02)';
    ctx.fillRect(0, 0, W, H);

    const centerX = cx + (mouse.x - cx) * 0.03;
    const centerY = cy + (mouse.y - cy) * 0.03;

    for (const c of curves) {
      ctx.beginPath();
      const steps = 300;
      for (let i = 0; i <= steps; i++) {
        const t = (i / steps) * Math.PI * 2;
        const x = centerX + Math.sin(c.a * t + c.delta + time * 0.3) * c.amp;
        const y = centerY + Math.sin(c.b * t + time * 0.2 + c.phase) * c.amp;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = `hsla(${c.hue + Math.sin(time + c.phase) * 20}, 80%, 60%, ${c.alpha})`;
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }

    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const t = (i / 200) * Math.PI * 2;
      const x = centerX + Math.sin(3 * t + time * 0.4) * 80 + Math.sin(5 * t + time * 0.5) * 30;
      const y = centerY + Math.sin(4 * t + time * 0.3) * 80 + Math.cos(7 * t + time * 0.4) * 30;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = `hsla(${280 + Math.sin(time * 0.3) * 20}, 80%, 60%, 0.04)`;
    ctx.lineWidth = 0.5;
    ctx.stroke();

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
