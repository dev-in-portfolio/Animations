<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Nebula</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #06060e; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.06); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Nebula · gas cloud drift</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const COUNT = 300;
  const particles = [];
  const cx = W / 2;
  const cy = H / 2;

  for (let i = 0; i < COUNT; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = Math.random() * 200;
    const hue = 200 + Math.random() * 100;
    particles.push({
      x: cx + Math.cos(angle) * r,
      y: cy + Math.sin(angle) * r,
      baseX: cx + Math.cos(angle) * r,
      baseY: cy + Math.sin(angle) * r,
      vx: (Math.random() - 0.5) * 0.1,
      vy: (Math.random() - 0.5) * 0.1,
      size: 5 + Math.random() * 20,
      hue,
      alpha: 0.02 + Math.random() * 0.06,
      phase: Math.random() * Math.PI * 2,
      speed: 0.2 + Math.random() * 0.3,
      amp: 5 + Math.random() * 15,
    });
  }

  let time = 0;

  function animate() {
    time += 0.002;
    ctx.fillStyle = 'rgba(6, 6, 14, 0.02)';
    ctx.fillRect(0, 0, W, H);

    for (const p of particles) {
      p.x += (p.baseX + Math.sin(time * p.speed + p.phase) * p.amp - p.x) * 0.01;
      p.y += (p.baseY + Math.cos(time * p.speed * 0.7 + p.phase) * p.amp * 0.6 - p.y) * 0.01;

      const hue = p.hue + Math.sin(time * 0.5 + p.phase) * 20;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, 60%, ${40 + Math.sin(time + p.phase) * 10}%, ${p.alpha})`;
      ctx.fill();

      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 2);
      grad.addColorStop(0, `hsla(${hue + 20}, 70%, 55%, ${p.alpha * 0.3})`);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 2, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
