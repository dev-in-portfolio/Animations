<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Tide</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #060e12; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.08); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Tide · rolling waves</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const LAYERS = 6;
  const PARTICLES_PER_LAYER = 60;
  const particles = [];

  for (let l = 0; l < LAYERS; l++) {
    const baseY = H * 0.4 + (l / LAYERS) * H * 0.3;
    const hue = 190 + l * 8;
    for (let i = 0; i < PARTICLES_PER_LAYER; i++) {
      particles.push({
        x: (i / PARTICLES_PER_LAYER) * W,
        y: baseY + (Math.random() - 0.5) * 10,
        baseY,
        layer: l,
        speed: 0.3 + l * 0.1,
        amp: 15 + l * 5,
        freq: 0.02 + l * 0.005,
        hue,
        size: 2 + (LAYERS - l) * 1.5,
        alpha: 0.15 + (LAYERS - l) * 0.05,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  let time = 0;

  function animate() {
    time += 0.004;
    ctx.fillStyle = 'rgba(6, 14, 18, 0.03)';
    ctx.fillRect(0, 0, W, H);

    for (const p of particles) {
      const wave = Math.sin(time * p.speed + p.x * p.freq + p.phase) * p.amp;
      const y = p.baseY + wave;
      const x = p.x + Math.sin(time * 0.2 + p.phase + p.y * 0.01) * 5;

      const alpha = p.alpha * (0.5 + Math.sin(time + p.phase + p.x * 0.01) * 0.3);

      ctx.beginPath();
      ctx.arc(x, y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue}, 60%, ${45 + p.layer * 5}%, ${alpha})`;
      ctx.fill();

      for (let j = 0; j < particles.length; j++) {
        const other = particles[j];
        if (other === p || other.layer !== p.layer) continue;
        const dx = x - other.x;
        const dy = y - other.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < 50) {
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(other.x, other.y);
          ctx.strokeStyle = `hsla(${p.hue}, 50%, 50%, ${alpha * 0.08})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
