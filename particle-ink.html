<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Ink</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f5f0e8; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(0,0,0,0.15); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Ink · click to drop</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const drops = [];

  function createDrop(x, y) {
    const count = 30 + Math.floor(Math.random() * 30);
    const particles = [];
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.3 + Math.random() * 1.5;
      const hue = 220 + Math.random() * 40;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 2 + Math.random() * 4,
        hue,
        life: 1,
        decay: 0.003 + Math.random() * 0.005,
        phase: Math.random() * Math.PI * 2,
      });
    }
    drops.push(particles);
  }

  document.addEventListener('click', (e) => {
    for (let d = 0; d < 3; d++) {
      setTimeout(() => {
        createDrop(
          e.clientX + (Math.random() - 0.5) * 30,
          e.clientY + (Math.random() - 0.5) * 30
        );
      }, d * 200);
    }
  });

  createDrop(W / 2, H / 2);

  let time = 0;

  function animate() {
    time += 0.005;
    ctx.fillStyle = 'rgba(245, 240, 232, 0.06)';
    ctx.fillRect(0, 0, W, H);

    for (let d = drops.length - 1; d >= 0; d--) {
      const particles = drops[d];
      let allDead = true;

      for (const p of particles) {
        p.vx *= 0.99;
        p.vy *= 0.99;
        p.x += p.vx;
        p.y += p.vy;
        p.size *= 0.998;
        p.life -= p.decay;

        if (p.life > 0) allDead = false;

        const alpha = p.life * 0.15;
        const hue = p.hue + Math.sin(time + p.phase) * 10;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${hue}, 60%, 35%, ${alpha})`;
        ctx.fill();
      }

      if (allDead) drops.splice(d, 1);
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
