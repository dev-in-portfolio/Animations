<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal Growth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #06040a; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.1); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Crystal Growth · geometric formations</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const crystals = [];

  function addCrystal() {
    const sides = 3 + Math.floor(Math.random() * 3);
    const size = 5 + Math.random() * 25;
    const cx = Math.random() * W;
    const cy = Math.random() * H;
    const hue = 200 + Math.random() * 140;
    const points = [];
    for (let i = 0; i < sides; i++) {
      const angle = (i / sides) * Math.PI * 2 - Math.PI / 2;
      const r = size * (0.5 + Math.random() * 0.5);
      points.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
    }
    crystals.push({
      x: cx,
      y: cy,
      points,
      size,
      hue,
      growth: 0,
      growthSpeed: 0.005 + Math.random() * 0.015,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.005,
      alpha: 0.3 + Math.random() * 0.4,
      finished: false,
    });
  }

  for (let i = 0; i < 25; i++) {
    const c = {
      x: Math.random() * W,
      y: Math.random() * H,
      points: [],
      size: 5 + Math.random() * 25,
      hue: 200 + Math.random() * 140,
      growth: Math.random(),
      growthSpeed: 0.005 + Math.random() * 0.015,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.005,
      alpha: 0.3 + Math.random() * 0.4,
      finished: false,
    };
    const sides = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < sides; i++) {
      const angle = (i / sides) * Math.PI * 2 - Math.PI / 2;
      const r = c.size * (0.5 + Math.random() * 0.5);
      c.points.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
    }
    crystals.push(c);
  }

  let time = 0;

  function animate() {
    time += 0.005;
    ctx.fillStyle = 'rgba(6, 4, 10, 0.05)';
    ctx.fillRect(0, 0, W, H);

    for (let i = crystals.length - 1; i >= 0; i--) {
      const c = crystals[i];

      if (c.growth < 1) {
        c.growth = Math.min(1, c.growth + c.growthSpeed);
        if (c.growth >= 1) c.finished = true;
      }

      c.rotation += c.rotSpeed;

      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rotation);

      const scale = 0.2 + c.growth * 0.8;
      const alpha = c.alpha * Math.min(1, c.growth * 2);

      ctx.beginPath();
      for (let j = 0; j < c.points.length; j++) {
        const p = c.points[j];
        const x = p.x * scale;
        const y = p.y * scale;
        if (j === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();

      ctx.fillStyle = `hsla(${c.hue + Math.sin(time + i) * 15}, 70%, 55%, ${alpha * 0.3})`;
      ctx.fill();
      ctx.strokeStyle = `hsla(${c.hue + Math.sin(time + i) * 15}, 80%, 65%, ${alpha * 0.6})`;
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.restore();
    }

    if (crystals.length < 40 && Math.random() < 0.02) {
      addCrystal();
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
