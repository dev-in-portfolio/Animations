<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boids</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050510; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.16); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Boids · flocking swarm</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const EPSILON = 0.0001;
  let W = 0;
  let H = 0;
  let dpr = 1;
  let resizeTimer;
  let rafId = 0;
  let lastTime = performance.now();

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = `${W}px`;
    canvas.style.height = `${H}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  resize();
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      resize();
      restartAnimation();
    }, 100);
  });

  const boids = [];
  const COUNT = 80;

  for (let i = 0; i < COUNT; i++) {
    boids.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2,
      hue: 200 + Math.random() * 60,
      size: 3 + Math.random() * 2,
    });
  }

  const pointer = { x: W / 2, y: H / 2, active: false };

  canvas.addEventListener('pointermove', (event) => {
    pointer.x = event.clientX;
    pointer.y = event.clientY;
    pointer.active = true;
  });
  canvas.addEventListener('pointerleave', () => { pointer.active = false; });
  canvas.addEventListener('pointercancel', () => { pointer.active = false; });

  function renderFrame(now) {
    const frameScale = Math.min(Math.max((now - lastTime) / 16.6667, 0.25), 2);
    lastTime = now;
    const fadeAlpha = 1 - Math.pow(1 - 0.04, frameScale);

    ctx.fillStyle = `rgba(5, 5, 16, ${fadeAlpha})`;
    ctx.fillRect(0, 0, W, H);

    for (const b of boids) {
      let alignX = 0, alignY = 0;
      let cohX = 0, cohY = 0;
      let sepX = 0, sepY = 0;
      let neighbors = 0;

      for (const other of boids) {
        if (other === b) continue;
        const dx = b.x - other.x;
        const dy = b.y - other.y;
        const distSq = dx * dx + dy * dy;

        if (distSq < 80 * 80) {
          alignX += other.vx;
          alignY += other.vy;
          cohX += other.x;
          cohY += other.y;
          neighbors++;
        }

        if (distSq > EPSILON && distSq < 25 * 25) {
          const distance = Math.sqrt(distSq);
          sepX += dx / distance;
          sepY += dy / distance;
        }
      }

      if (neighbors > 0) {
        alignX = (alignX / neighbors - b.vx) * 0.02;
        alignY = (alignY / neighbors - b.vy) * 0.02;
        cohX = (cohX / neighbors - b.x) * 0.003;
        cohY = (cohY / neighbors - b.y) * 0.003;
      }

      let pointerForceX = 0;
      let pointerForceY = 0;
      if (pointer.active) {
        const dx = pointer.x - b.x;
        const dy = pointer.y - b.y;
        const distSq = dx * dx + dy * dy;
        if (distSq > EPSILON && distSq < 150 * 150) {
          const distance = Math.sqrt(distSq);
          pointerForceX = -(dx / distance) * 0.3;
          pointerForceY = -(dy / distance) * 0.3;
        }
      }

      b.vx += (alignX + cohX + sepX * 0.05 + pointerForceX) * frameScale;
      b.vy += (alignY + cohY + sepY * 0.05 + pointerForceY) * frameScale;

      const speed = Math.hypot(b.vx, b.vy);
      if (speed > 3) {
        b.vx *= 3 / speed;
        b.vy *= 3 / speed;
      } else if (speed < 0.5) {
        b.vx *= 1.02;
        b.vy *= 1.02;
      }

      b.x += b.vx * frameScale;
      b.y += b.vy * frameScale;

      if (b.x < -20) b.x = W + 20;
      if (b.x > W + 20) b.x = -20;
      if (b.y < -20) b.y = H + 20;
      if (b.y > H + 20) b.y = -20;

      const angle = Math.atan2(b.vy, b.vx);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.moveTo(b.size * 2, 0);
      ctx.lineTo(-b.size, -b.size * 0.6);
      ctx.lineTo(-b.size, b.size * 0.6);
      ctx.closePath();
      ctx.fillStyle = `hsla(${b.hue}, 70%, 60%, 0.7)`;
      ctx.fill();
      ctx.restore();
    }
  }

  function animate(now) {
    renderFrame(now);
    if (!reducedMotion.matches && !document.hidden) {
      rafId = requestAnimationFrame(animate);
    }
  }

  function restartAnimation() {
    cancelAnimationFrame(rafId);
    lastTime = performance.now();
    rafId = requestAnimationFrame(animate);
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) restartAnimation();
    else cancelAnimationFrame(rafId);
  });
  reducedMotion.addEventListener('change', restartAnimation);
  restartAnimation();
</script>
</body>
</html>
