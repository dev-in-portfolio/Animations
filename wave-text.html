<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wave Text</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.2); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Wave Text · sine canvas</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const sampleCanvas = document.createElement('canvas');
  const sampleCtx = sampleCanvas.getContext('2d', { willReadFrequently: true });
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const text = 'WAVE';
  const step = 4;
  const particles = [];

  let W = 0;
  let H = 0;
  let dpr = 1;
  let fontSize = 140;
  let resizeTimer;
  let rafId = 0;

  function resizeCanvas() {
    W = window.innerWidth;
    H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = `${W}px`;
    canvas.style.height = `${H}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    sampleCanvas.width = W;
    sampleCanvas.height = H;
    fontSize = Math.max(64, Math.min(140, W * 0.22));
  }

  function buildTextParticles() {
    particles.length = 0;
    sampleCtx.clearRect(0, 0, W, H);
    sampleCtx.fillStyle = '#fff';
    sampleCtx.textBaseline = 'alphabetic';
    sampleCtx.font = `900 ${fontSize}px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;

    const textWidth = sampleCtx.measureText(text).width;
    const startX = (W - textWidth) / 2;
    const startY = H / 2 + fontSize * 0.35;
    sampleCtx.fillText(text, startX, startY);

    const imageData = sampleCtx.getImageData(0, 0, W, H).data;
    for (let y = 0; y < H; y += step) {
      for (let x = 0; x < W; x += step) {
        const index = (y * W + x) * 4;
        if (imageData[index + 3] > 128) {
          particles.push({
            ox: x,
            oy: y,
            phase: Math.random() * Math.PI * 2,
            size: 1.5 + Math.random() * 2,
            hue: 220 + Math.random() * 60,
          });
        }
      }
    }
  }

  function rebuild() {
    resizeCanvas();
    buildTextParticles();
    renderFrame(performance.now());
  }

  function renderFrame(now) {
    const time = reducedMotion.matches ? 0 : now * 0.0012;
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, W, H);

    for (const particle of particles) {
      const x = particle.ox + Math.sin(time + particle.phase) * 12;
      const y = particle.oy + Math.cos(time * 0.7 + particle.phase * 1.3) * 8;
      const alpha = 0.4 + Math.sin(time + particle.phase) * 0.3;

      ctx.beginPath();
      ctx.arc(x, y, particle.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${particle.hue + Math.sin(time + particle.phase) * 20}, 80%, 65%, ${alpha})`;
      ctx.fill();
    }
  }

  function animate(now) {
    renderFrame(now);
    if (!reducedMotion.matches && !document.hidden) {
      rafId = requestAnimationFrame(animate);
    }
  }

  function restartAnimation() {
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(animate);
  }

  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      rebuild();
      restartAnimation();
    }, 100);
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) restartAnimation();
    else cancelAnimationFrame(rafId);
  });
  reducedMotion.addEventListener('change', restartAnimation);

  rebuild();
  restartAnimation();
</script>
</body>
</html>
