<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wave Text</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.15); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Wave Text · sine canvas</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const text = 'WAVE';
  const fontSize = 140;
  ctx.font = `900 ${fontSize}px 'Inter', -apple-system, sans-serif`;
  const metrics = ctx.measureText(text);
  const textWidth = metrics.width;
  const startX = (W - textWidth) / 2;
  const startY = H / 2;

  const step = 4;
  const particles = [];

  function getTextParticles() {
    particles.length = 0;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.fillText(text, startX, startY);
    const imageData = ctx.getImageData(0, 0, W, H);
    const data = imageData.data;

    for (let y = 0; y < H; y += step) {
      for (let x = 0; x < W; x += step) {
        const idx = (y * W + x) * 4;
        if (data[idx + 3] > 128) {
          particles.push({
            ox: x, oy: y,
            x, y,
            phase: Math.random() * Math.PI * 2,
            size: 1.5 + Math.random() * 2,
            hue: 220 + Math.random() * 60,
          });
        }
      }
    }
  }

  getTextParticles();

  let time = 0;

  function animate() {
    time += 0.02;
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, W, H);

    for (const p of particles) {
      p.x = p.ox + Math.sin(time + p.phase) * 12;
      p.y = p.oy + Math.cos(time * 0.7 + p.phase * 1.3) * 8;

      const alpha = 0.4 + Math.sin(time + p.phase) * 0.3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue + Math.sin(time + p.phase) * 20}, 80%, 65%, ${alpha})`;
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }
  animate();

  window.addEventListener('resize', () => {
    resize();
    ctx.font = `900 ${fontSize}px 'Inter', -apple-system, sans-serif`;
    getTextParticles();
  });
</script>
</body>
</html>
