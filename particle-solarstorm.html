<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Solar Storm</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #040408; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.06); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Solar Storm · coronal ejection</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const cx = W / 2;
  const cy = H / 2;
  const particles = [];
  const LOOPS = 6;

  for (let l = 0; l < LOOPS; l++) {
    const baseAngle = (l / LOOPS) * Math.PI * 2;
    const count = 60;
    for (let i = 0; i < count; i++) {
      const t = i / count;
      const angle = baseAngle + t * 0.8 - 0.4;
      const speed = 1.5 + t * 3;
      particles.push({
        x: cx,
        y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed * 0.6,
        size: 2 + t * 4,
        hue: 40 + t * 30 + Math.random() * 10,
        alpha: 0.8 - t * 0.5,
        life: 1,
        decay: 0.002 + t * 0.004,
        phase: Math.random() * Math.PI * 2,
        trail: [],
      });
    }
  }

  for (let i = 0; i < 100; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = Math.random() * 200;
    particles.push({
      x: cx + Math.cos(angle) * r,
      y: cy + Math.sin(angle) * r,
      vx: (Math.random() - 0.5) * 0.1,
      vy: (Math.random() - 0.5) * 0.1,
      size: 1 + Math.random() * 2,
      hue: 200 + Math.random() * 60,
      alpha: 0.1 + Math.random() * 0.2,
      life: 1,
      decay: 0.001,
      phase: Math.random() * Math.PI * 2,
      trail: [],
    });
  }

  let time = 0;
  let pulse = 0;

  function animate() {
    time += 0.003;
    pulse = Math.sin(time * 0.5) * 0.5 + 0.5;

    ctx.fillStyle = 'rgba(4, 4, 8, 0.02)';
    ctx.fillRect(0, 0, W, H);

    const sunGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 30 + pulse * 10);
    sunGrad.addColorStop(0, `hsla(40, 100%, 80%, ${0.08 + pulse * 0.05})`);
    sunGrad.addColorStop(0.5, `hsla(30, 100%, 60%, 0.03)`);
    sunGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, 30 + pulse * 10, 0, Math.PI * 2);
    ctx.fill();

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      p.trail.push({ x: p.x, y: p.y });
      if (p.trail.length > 8) p.trail.shift();

      if (p.life <= 0 || p.x < -200 || p.x > W + 200 || p.y < -200 || p.y > H + 200) {
        particles.splice(i, 1);
        continue;
      }

      const spacing = Math.sqrt(p.vx ** 2 + p.vy ** 2) > 1;

      if (spacing) {
        for (let t = 0; t < p.trail.length; t++) {
          const f = t / p.trail.length;
          ctx.beginPath();
          ctx.arc(p.trail[t].x, p.trail[t].y, p.size * f * 0.3, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${p.hue + f * 20}, 100%, ${40 + f * 40}%, ${p.life * f * 0.1})`;
          ctx.fill();
        }
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue}, 100%, ${50 + (1 - p.life) * 30}%, ${p.life * p.alpha})`;
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
