<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Fire</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0505; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.1); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Fire · click for burst</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const particles = [];
  const MAX = 400;

  function spawnFire(cx, cy, count) {
    for (let i = 0; i < count; i++) {
      if (particles.length >= MAX) break;
      const angle = (Math.random() - 0.5) * 1.2;
      const speed = 0.5 + Math.random() * 3;
      particles.push({
        x: cx + (Math.random() - 0.5) * 15,
        y: cy,
        vx: Math.sin(angle) * speed * 0.3,
        vy: -(speed + Math.random() * 2),
        size: 2 + Math.random() * 5,
        life: 1,
        decay: 0.008 + Math.random() * 0.012,
        hue: 20 + Math.random() * 30,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  for (let i = 0; i < 60; i++) {
    spawnFire(W / 2, H - 30, 1);
  }

  let spawnTimer = 0;

  document.addEventListener('click', (e) => {
    spawnFire(e.clientX, e.clientY, 50);
  });

  let time = 0;

  function animate() {
    time += 0.005;
    ctx.fillStyle = 'rgba(5, 3, 3, 0.04)';
    ctx.fillRect(0, 0, W, H);

    spawnTimer++;
    if (spawnTimer % 2 === 0) spawnFire(W / 2 + (Math.random() - 0.5) * 30, H - 20, 3);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy -= 0.01 + (1 - p.life) * 0.02;
      p.vx *= 0.99;
      p.x += p.vx + Math.sin(time + p.phase + p.x * 0.01) * 0.1;
      p.y += p.vy;
      p.life -= p.decay;
      p.size *= 0.997;

      if (p.life <= 0 || p.y < -20) { particles.splice(i, 1); continue; }

      const hue = p.hue + (1 - p.life) * 30;
      const alpha = p.life * 0.7;
      const size = p.size * p.life;

      ctx.beginPath();
      ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, 100%, ${40 + (1 - p.life) * 30}%, ${alpha})`;
      ctx.fill();

      if (p.life > 0.5) {
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 4);
        grad.addColorStop(0, `hsla(${hue}, 100%, 60%, ${alpha * 0.1})`);
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, size * 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
