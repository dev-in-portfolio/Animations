<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Volcano</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #080406; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.06); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Volcano · erupting</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const particles = [];
  const MAX = 400;
  const ventX = W / 2;
  const ventY = H - 40;

  function erupt() {
    const count = 5 + Math.floor(Math.random() * 10);
    for (let i = 0; i < count; i++) {
      if (particles.length >= MAX) break;
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.6;
      const speed = 4 + Math.random() * 8;
      particles.push({
        x: ventX + (Math.random() - 0.5) * 10,
        y: ventY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 3 + Math.random() * 6,
        hue: 30 + Math.random() * 20,
        life: 1,
        decay: 0.004 + Math.random() * 0.006,
        phase: Math.random() * Math.PI * 2,
        trail: [],
      });
    }
  }

  let time = 0;
  let eruptionIntensity = 1;

  function animate() {
    time += 0.004;
    eruptionIntensity = 0.7 + Math.sin(time * 0.5) * 0.3;

    ctx.fillStyle = `rgba(8, 4, 6, 0.03)`;
    ctx.fillRect(0, 0, W, H);

    const glowGrad = ctx.createRadialGradient(ventX, ventY - 20, 0, ventX, ventY - 20, 40 + eruptionIntensity * 30);
    glowGrad.addColorStop(0, `rgba(255, 100, 20, ${0.05 * eruptionIntensity})`);
    glowGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(ventX, ventY - 20, 40 + eruptionIntensity * 30, 0, Math.PI * 2);
    ctx.fill();

    if (Math.random() < 0.3 * eruptionIntensity) erupt();

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += 0.04;
      p.vx *= 0.998;
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      p.size *= 0.997;
      p.trail.push({ x: p.x, y: p.y });
      if (p.trail.length > 10) p.trail.shift();

      if (p.life <= 0) { particles.splice(i, 1); continue; }

      for (let t = 0; t < p.trail.length; t++) {
        const f = t / p.trail.length;
        ctx.beginPath();
        ctx.arc(p.trail[t].x, p.trail[t].y, p.size * f * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${p.hue + 10}, 100%, ${30 + f * 40}%, ${p.life * f * 0.12})`;
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue + (1 - p.life) * 20}, 100%, ${40 + (1 - p.life) * 30}%, ${p.life * 0.7})`;
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
