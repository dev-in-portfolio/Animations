<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Monolith</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #06060a; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.06); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Monolith · assembling</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const cx = W / 2;
  const cy = H / 2;
  const COUNT = 600;
  const particles = [];

  const hw = 25;
  const hh = 100;

  for (let i = 0; i < COUNT; i++) {
    const side = Math.random() > 0.15;
    let tx, ty;
    if (side) {
      const edge = Math.floor(Math.random() * 4);
      if (edge === 0) { tx = -hw + Math.random() * hw * 2; ty = -hh; }
      else if (edge === 1) { tx = hw; ty = -hh + Math.random() * hh * 2; }
      else if (edge === 2) { tx = -hw + Math.random() * hw * 2; ty = hh; }
      else { tx = -hw; ty = -hh + Math.random() * hh * 2; }
    } else {
      const angle = Math.random() * Math.PI * 2;
      const r = 5 + Math.random() * 15;
      tx = Math.cos(angle) * r;
      ty = Math.sin(angle) * r;
    }
    const a2 = Math.random() * Math.PI * 2;
    const r2 = 180 + Math.random() * 150;
    particles.push({
      x: cx + Math.cos(a2) * r2,
      y: cy + Math.sin(a2) * r2,
      tx: cx + tx,
      ty: cy + ty,
      size: 2 + Math.random() * 3,
      hue: 220 + Math.random() * 40,
      phase: Math.random() * Math.PI * 2,
      speed: 0.008 + Math.random() * 0.012,
    });
  }

  let time = 0;
  let assembled = false;

  function animate() {
    time += 0.003;
    ctx.fillStyle = 'rgba(6, 6, 10, 0.015)';
    ctx.fillRect(0, 0, W, H);

    let allArrived = true;

    for (const p of particles) {
      const dx = p.tx - p.x;
      const dy = p.ty - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > 0.5) {
        allArrived = false;
        p.x += dx * p.speed;
        p.y += dy * p.speed;
      }

      const frac = Math.max(0, 1 - dist / 300);
      const wobble = assembled ? Math.sin(time + p.phase) * 0.8 : 0;
      const x = p.x + wobble;
      const y = p.y + Math.cos(time * 0.7 + p.phase) * 0.8;

      const alpha = 0.08 + frac * 0.5;
      const size = p.size * (0.2 + frac * 0.8);

      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue + frac * 10}, 70%, ${35 + frac * 30}%, ${alpha})`;
      ctx.fill();
    }

    if (allArrived && !assembled) assembled = true;

    if (assembled) {
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120);
      g.addColorStop(0, 'hsla(240, 60%, 40%, 0.02)');
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, 120, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
