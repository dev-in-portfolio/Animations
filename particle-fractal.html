<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Fractal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050308; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.06); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Fractal · click to re-seed</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const COUNT = 2000;
  const particles = [];
  let targets = [];
  let zoom = 1;
  let offsetX = 0, offsetY = 0;

  function generateFractalTargets() {
    targets = [];
    const scale = 3.5 / zoom;
    const halfW = W / 2;
    const halfH = H / 2;
    const aspect = W / H;
    const maxIter = 40;

    for (let i = 0; i < COUNT; i++) {
      const sx = (Math.random() - 0.5) * 2;
      const sy = (Math.random() - 0.5) * 2 / aspect;
      const cx = sx * scale + offsetX;
      const cy = sy * scale + offsetY;

      let zx = 0, zy = 0;
      let iter = 0;
      while (iter < maxIter) {
        const nzx = zx * zx - zy * zy + cx;
        const nzy = 2 * zx * zy + cy;
        zx = nzx; zy = nzy;
        if (zx * zx + zy * zy > 4) break;
        iter++;
      }

      const escaped = iter < maxIter;
      const px = halfW + (sx * halfW);
      const py = halfH + (sy * halfH * aspect);

      targets.push({
        x: px, y: py,
        iter,
        escaped,
        maxIter,
        hue: escaped ? (iter * 15 + 200) % 360 : 280,
        brightness: escaped ? 30 + (iter / maxIter) * 60 : 15,
      });
    }
  }

  for (let i = 0; i < COUNT; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: 0, vy: 0,
      size: 2 + Math.random() * 3,
      phase: Math.random() * Math.PI * 2,
    });
  }

  generateFractalTargets();

  canvas.addEventListener('click', () => {
    zoom *= 1.5;
    generateFractalTargets();
    for (let i = 0; i < COUNT; i++) {
      const t = targets[i];
      if (t) {
        particles[i].x = Math.random() * W;
        particles[i].y = Math.random() * H;
      }
    }
  });

  let time = 0;

  function animate() {
    time += 0.005;
    ctx.fillStyle = 'rgba(5, 3, 8, 0.05)';
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < COUNT; i++) {
      const p = particles[i];
      const t = targets[i];
      if (!t) continue;

      const dx = t.x - p.x;
      const dy = t.y - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > 1) {
        p.vx += dx * 0.02;
        p.vy += dy * 0.02;
        p.vx *= 0.92;
        p.vy *= 0.92;
        p.x += p.vx;
        p.y += p.vy;
      } else {
        p.x += (Math.random() - 0.5) * 0.3;
        p.y += (Math.random() - 0.5) * 0.3;
      }

      const alpha = t.escaped ? 0.3 + (t.iter / t.maxIter) * 0.5 : 0.08;
      const size = p.size * (t.escaped ? 0.6 + (t.iter / t.maxIter) * 0.6 : 0.3);

      ctx.beginPath();
      ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${t.hue + Math.sin(time + p.phase) * 10}, 80%, ${t.brightness + Math.sin(time * 0.5 + p.phase) * 10}%, ${alpha})`;
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
