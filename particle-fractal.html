<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Fractal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050308; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: manipulation; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.16); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Fractal · tap or click to zoom</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const COUNT = 2000;
  const particles = [];

  let W = 0;
  let H = 0;
  let dpr = 1;
  let targets = [];
  let zoom = 1;
  let offsetX = 0;
  let offsetY = 0;
  let resizeTimer;
  let rafId = 0;
  let lastTime = performance.now();

  function resizeCanvas() {
    W = window.innerWidth;
    H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = `${W}px`;
    canvas.style.height = `${H}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function generateFractalTargets() {
    targets = [];
    const complexScale = 3.5 / zoom;
    const halfW = W / 2;
    const halfH = H / 2;
    const aspect = W / Math.max(H, 1);
    const maxIter = 40;

    for (let i = 0; i < COUNT; i++) {
      const screenX = (Math.random() - 0.5) * 2;
      const screenY = (Math.random() - 0.5) * 2 / aspect;
      const cx = screenX * complexScale + offsetX;
      const cy = screenY * complexScale + offsetY;

      let zx = 0;
      let zy = 0;
      let iteration = 0;
      while (iteration < maxIter) {
        const nextX = zx * zx - zy * zy + cx;
        const nextY = 2 * zx * zy + cy;
        zx = nextX;
        zy = nextY;
        if (zx * zx + zy * zy > 4) break;
        iteration++;
      }

      const escaped = iteration < maxIter;
      targets.push({
        x: halfW + screenX * halfW,
        y: halfH + screenY * halfH * aspect,
        iteration,
        escaped,
        maxIter,
        hue: escaped ? (iteration * 15 + 200) % 360 : 280,
        brightness: escaped ? 30 + (iteration / maxIter) * 60 : 15,
      });
    }
  }

  function initializeParticles() {
    particles.length = 0;
    for (let i = 0; i < COUNT; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: 0,
        vy: 0,
        size: 2 + Math.random() * 3,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  function rebuild(resetParticles = false) {
    resizeCanvas();
    generateFractalTargets();
    if (resetParticles || particles.length !== COUNT) {
      initializeParticles();
    } else {
      for (const particle of particles) {
        if (particle.x < 0 || particle.x > W || particle.y < 0 || particle.y > H) {
          particle.x = Math.random() * W;
          particle.y = Math.random() * H;
          particle.vx = 0;
          particle.vy = 0;
        }
      }
    }
  }

  function renderFrame(now) {
    const frameScale = Math.min(Math.max((now - lastTime) / 16.6667, 0.25), 2);
    lastTime = now;
    const time = now * 0.0003;

    ctx.fillStyle = 'rgba(5, 3, 8, 0.05)';
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < COUNT; i++) {
      const particle = particles[i];
      const target = targets[i];
      if (!target) continue;

      if (reducedMotion.matches) {
        particle.x = target.x;
        particle.y = target.y;
        particle.vx = 0;
        particle.vy = 0;
      } else {
        const dx = target.x - particle.x;
        const dy = target.y - particle.y;
        const distance = Math.hypot(dx, dy);

        if (distance > 1) {
          particle.vx += dx * 0.02 * frameScale;
          particle.vy += dy * 0.02 * frameScale;
          particle.vx *= Math.pow(0.92, frameScale);
          particle.vy *= Math.pow(0.92, frameScale);
          particle.x += particle.vx * frameScale;
          particle.y += particle.vy * frameScale;
        } else {
          particle.x += (Math.random() - 0.5) * 0.3;
          particle.y += (Math.random() - 0.5) * 0.3;
        }
      }

      const alpha = target.escaped ? 0.3 + (target.iteration / target.maxIter) * 0.5 : 0.08;
      const size = particle.size * (target.escaped ? 0.6 + (target.iteration / target.maxIter) * 0.6 : 0.3);
      const shimmer = reducedMotion.matches ? 0 : Math.sin(time + particle.phase) * 10;

      ctx.beginPath();
      ctx.arc(particle.x, particle.y, size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${target.hue + shimmer}, 80%, ${target.brightness + shimmer}%, ${alpha})`;
      ctx.fill();
    }
  }

  function animate(now) {
    renderFrame(now);
    if (!reducedMotion.matches && !document.hidden) {
      rafId = requestAnimationFrame(animate);
    }
  }

  function restartAnimation() {
    cancelAnimationFrame(rafId);
    lastTime = performance.now();
    rafId = requestAnimationFrame(animate);
  }

  canvas.addEventListener('pointerdown', (event) => {
    const halfW = W / 2;
    const halfH = H / 2;
    const aspect = W / Math.max(H, 1);
    const complexScale = 3.5 / zoom;
    const screenX = (event.clientX - halfW) / Math.max(halfW, 1);
    const screenY = (event.clientY - halfH) / Math.max(halfH * aspect, 1);

    offsetX += screenX * complexScale;
    offsetY += screenY * complexScale;
    zoom *= 1.5;
    generateFractalTargets();

    for (const particle of particles) {
      particle.x = Math.random() * W;
      particle.y = Math.random() * H;
      particle.vx = 0;
      particle.vy = 0;
    }
    restartAnimation();
  });

  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      rebuild(false);
      restartAnimation();
    }, 120);
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) restartAnimation();
    else cancelAnimationFrame(rafId);
  });
  reducedMotion.addEventListener('change', restartAnimation);

  rebuild(true);
  restartAnimation();
</script>
</body>
</html>
