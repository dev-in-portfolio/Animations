<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spiral Galaxy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050308; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.1); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Spiral Galaxy · swirling star arms</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const stars = [];
  const COUNT = 600;
  const arms = 3;

  for (let i = 0; i < COUNT; i++) {
    const arm = i % arms;
    const dist = Math.random() * 280;
    const angleOffset = (arm / arms) * Math.PI * 2;
    const spread = (1 - dist / 280) * 0.3 + 0.02;
    const angle = dist * 0.03 + angleOffset + (Math.random() - 0.5) * spread;
    stars.push({
      angle,
      dist,
      size: 0.5 + Math.random() * 2.5 * (1 - dist / 280),
      speed: 0.1 + (1 - dist / 280) * 0.4,
      brightness: 0.3 + Math.random() * 0.7,
      hue: 220 + Math.random() * 80 + dist * 0.1,
      twinkleSpeed: 1 + Math.random() * 3,
      twinkleOffset: Math.random() * Math.PI * 2,
    });
  }

  let time = 0;

  function animate() {
    time += 0.004;
    ctx.fillStyle = 'rgba(5, 3, 8, 0.08)';
    ctx.fillRect(0, 0, W, H);

    const cx = W / 2;
    const cy = H / 2;

    for (const s of stars) {
      s.angle += s.speed * 0.003;

      const x = cx + Math.cos(s.angle) * s.dist;
      const y = cy + Math.sin(s.angle) * s.dist * 0.6;

      const twinkle = 0.5 + Math.sin(time * s.twinkleSpeed + s.twinkleOffset) * 0.5;
      const alpha = s.brightness * twinkle;

      ctx.beginPath();
      ctx.arc(x, y, s.size * (0.5 + twinkle * 0.5), 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${s.hue + Math.sin(time + s.angle) * 15}, 70%, ${50 + twinkle * 30}%, ${alpha * 0.8})`;
      ctx.fill();

      if (s.size > 1.2) {
        ctx.beginPath();
        ctx.arc(x, y, s.size * 2.5, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${s.hue}, 60%, 60%, ${alpha * 0.06})`;
        ctx.fill();
      }
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
