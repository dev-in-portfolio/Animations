<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Smoke</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #080808; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.06); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Smoke · wispy drift</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const particles = [];
  const MAX = 150;

  function spawn() {
    if (particles.length >= MAX) return;
    particles.push({
      x: W / 2 + (Math.random() - 0.5) * 40,
      y: H - 10,
      vx: (Math.random() - 0.5) * 0.3,
      vy: -(0.5 + Math.random() * 1),
      size: 5 + Math.random() * 15,
      hue: 30 + Math.random() * 20,
      alpha: 0.08 + Math.random() * 0.06,
      phase: Math.random() * Math.PI * 2,
      growth: 0.3 + Math.random() * 0.3,
    });
  }

  for (let i = 0; i < 40; i++) spawn();

  setInterval(spawn, 80);

  let time = 0;

  function animate() {
    time += 0.003;
    ctx.fillStyle = 'rgba(8, 8, 8, 0.02)';
    ctx.fillRect(0, 0, W, H);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vx += Math.sin(time * 0.3 + p.phase) * 0.003;
      p.vy *= 0.998;
      p.x += p.vx;
      p.y += p.vy;
      p.size += p.growth * 0.05;
      p.alpha *= 0.998;

      if (p.y < -50 || p.alpha < 0.005) { particles.splice(i, 1); continue; }

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue}, 30%, ${40 + Math.sin(time + p.phase) * 5}%, ${p.alpha})`;
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
