<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubble</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #080610; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(200,150,255,0.12); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Bubble · iridescent floaters</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const bubbles = [];

  function createBubble(clickX, clickY) {
    return {
      x: clickX !== undefined ? clickX : Math.random() * W,
      y: clickY !== undefined ? clickY : H + 20,
      r: 10 + Math.random() * 40,
      vx: (Math.random() - 0.5) * 0.2,
      vy: -(0.1 + Math.random() * 0.4),
      phase: Math.random() * Math.PI * 2,
      wobble: Math.random() * 0.02 + 0.01,
      hue: 200 + Math.random() * 160,
      alpha: 0.2 + Math.random() * 0.3,
      life: 1,
      pop: false,
    };
  }

  for (let i = 0; i < 15; i++) {
    bubbles.push(createBubble());
  }

  document.addEventListener('click', (e) => {
    for (let i = 0; i < 3; i++) {
      bubbles.push(createBubble(e.clientX + (Math.random() - 0.5) * 30, e.clientY + (Math.random() - 0.5) * 30));
    }
  });

  let time = 0;

  function animate() {
    time += 0.004;
    ctx.fillStyle = 'rgba(8, 6, 16, 0.03)';
    ctx.fillRect(0, 0, W, H);

    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.x += b.vx + Math.sin(time * 0.5 + b.phase) * 0.15;
      b.y += b.vy;
      b.vy *= 0.999;

      const wobX = Math.sin(time * b.wobble * 10 + b.phase) * b.r * 0.05;
      const wobY = Math.cos(time * b.wobble * 8 + b.phase) * b.r * 0.05;

      const grad = ctx.createRadialGradient(
        b.x - b.r * 0.3 + wobX, b.y - b.r * 0.3 + wobY, 0,
        b.x, b.y, b.r
      );
      grad.addColorStop(0, `hsla(${b.hue}, 80%, 80%, ${b.alpha * 0.3})`);
      grad.addColorStop(0.3, `hsla(${b.hue + 30}, 70%, 65%, ${b.alpha * 0.15})`);
      grad.addColorStop(0.6, `hsla(${b.hue + 60}, 60%, 50%, ${b.alpha * 0.08})`);
      grad.addColorStop(1, `hsla(${b.hue + 90}, 50%, 40%, 0)`);

      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.25, b.y - b.r * 0.25, b.r * 0.2, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(255, 90%, 90%, ${b.alpha * 0.2})`;
      ctx.fill();

      if (b.y < -b.r * 2) {
        bubbles.splice(i, 1);
      }
    }

    if (bubbles.length < 20 && Math.random() < 0.02) {
      bubbles.push(createBubble());
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
