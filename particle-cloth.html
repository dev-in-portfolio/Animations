<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Cloth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #08080a; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; cursor: grab; }
  body:active { cursor: grabbing; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.06); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Cloth · click & drag to grab</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const COLS = 28;
  const ROWS = 22;
  const SPACING = 14;
  const START_X = (W - COLS * SPACING) / 2;
  const START_Y = 40;

  const particles = [];
  const springs = [];
  let mouse = { x: W / 2, y: H / 2, down: false };
  let grabbed = null;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const pinned = r === 0;
      particles.push({
        x: START_X + c * SPACING,
        y: START_Y + r * SPACING,
        ox: START_X + c * SPACING,
        oy: START_Y + r * SPACING,
        vx: 0, vy: 0,
        pinned,
      });
      if (c > 0) {
        springs.push({ a: r * COLS + c, b: r * COLS + c - 1, rest: SPACING });
      }
      if (r > 0) {
        springs.push({ a: r * COLS + c, b: (r - 1) * COLS + c, rest: SPACING });
      }
    }
  }

  canvas.addEventListener('mousedown', e => {
    mouse.down = true;
    grabbed = null;
    let minDist = 30;
    for (const p of particles) {
      const dx = e.clientX - p.x;
      const dy = e.clientY - p.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < minDist) {
        minDist = d;
        grabbed = p;
      }
    }
  });

  canvas.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  canvas.addEventListener('mouseup', () => {
    mouse.down = false;
    grabbed = null;
  });

  function simulate() {
    const GRAVITY = 0.45;
    const DAMPING = 0.97;
    const ITERATIONS = 5;

    for (const p of particles) {
      if (p.pinned && p.y < START_Y + 2) continue;
      p.vy += GRAVITY;
      p.vx *= DAMPING;
      p.vy *= DAMPING;
      p.x += p.vx;
      p.y += p.vy;
    }

    if (grabbed && mouse.down) {
      grabbed.x += (mouse.x - grabbed.x) * 0.4;
      grabbed.y += (mouse.y - grabbed.y) * 0.4;
      grabbed.vx = 0;
      grabbed.vy = 0;
    }

    for (let iter = 0; iter < ITERATIONS; iter++) {
      for (const s of springs) {
        const a = particles[s.a];
        const b = particles[s.b];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 0.001) continue;
        const diff = (dist - s.rest) / dist;
        const cx = dx * diff * 0.5;
        const cy = dy * diff * 0.5;
        if (!a.pinned) { a.x += cx; a.vx += cx * 0.3; a.y += cy; a.vy += cy * 0.3; }
        if (!b.pinned) { b.x -= cx; b.vx -= cx * 0.3; b.y -= cy; b.vy -= cy * 0.3; }
      }
    }
  }

  let time = 0;

  function draw() {
    time += 0.01;
    ctx.fillStyle = 'rgba(8, 8, 10, 0.15)';
    ctx.fillRect(0, 0, W, H);

    for (const s of springs) {
      const a = particles[s.a];
      const b = particles[s.b];
      const stretch = Math.sqrt((b.x - a.x) ** 2 + (b.y - a.y) ** 2) / s.rest;
      const tension = Math.min(1, Math.max(0, (stretch - 0.8) / 0.8));
      const hue = 200 + tension * 120;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = `hsla(${hue}, 80%, ${50 + tension * 30}%, ${0.08 + tension * 0.4})`;
      ctx.lineWidth = 0.5 + tension * 1.5;
      ctx.stroke();
    }

    for (const p of particles) {
      const dx = p.x - p.ox;
      const dy = p.y - p.oy;
      const speed = Math.sqrt(dx * dx + dy * dy);
      const hue = 220 + Math.sin(time + speed * 0.3) * 20;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1 + speed * 0.3, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, 70%, ${55 + speed * 10}%, ${0.3 + speed * 0.2})`;
      ctx.fill();
    }
  }

  function animate() {
    simulate();
    draw();
    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
