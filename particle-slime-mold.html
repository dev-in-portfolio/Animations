<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Slime Mold</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050306; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.06); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Slime Mold · click to place food</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const AGENTS = 800;
  const SENSOR = 6;
  const ANGLE = 0.3;
  const SPEED = 1;

  const scale = Math.max(W, H) / 300;
  const RW = Math.ceil(W / scale);
  const RH = Math.ceil(H / scale);
  const trail = new Float32Array(RW * RH);
  const agents = [];

  function sample(x, y) {
    const ix = Math.floor(x / scale);
    const iy = Math.floor(y / scale);
    if (ix < 0 || ix >= RW || iy < 0 || iy >= RH) return 0;
    return trail[ix + iy * RW];
  }

  function deposit(x, y, v) {
    const ix = Math.floor(x / scale);
    const iy = Math.floor(y / scale);
    if (ix < 0 || ix >= RW || iy < 0 || iy >= RH) return;
    trail[ix + iy * RW] = Math.min(1, trail[ix + iy * RW] + v);
  }

  function placeFood(cx, cy, count) {
    for (let i = 0; i < count; i++) {
      const x = cx + (Math.random() - 0.5) * 80;
      const y = cy + (Math.random() - 0.5) * 80;
      deposit(x, y, 1);
    }
  }

  const foodSpots = [];
  for (let i = 0; i < 6; i++) {
    const fx = W * (0.2 + Math.random() * 0.6);
    const fy = H * (0.2 + Math.random() * 0.6);
    placeFood(fx, fy, 50);
    foodSpots.push({ x: fx, y: fy });
  }

  for (let i = 0; i < AGENTS; i++) {
    const spot = foodSpots[Math.floor(Math.random() * foodSpots.length)];
    agents.push({
      x: spot.x + (Math.random() - 0.5) * 40,
      y: spot.y + (Math.random() - 0.5) * 40,
      a: Math.random() * Math.PI * 2,
      hue: 270 + Math.random() * 60,
    });
  }

  canvas.addEventListener('click', e => {
    placeFood(e.clientX, e.clientY, 80);
    foodSpots.push({ x: e.clientX, y: e.clientY });
  });

  function simulate() {
    for (const agent of agents) {
      const fx = sample(agent.x + Math.cos(agent.a) * SENSOR, agent.y + Math.sin(agent.a) * SENSOR);
      const lx = sample(agent.x + Math.cos(agent.a - ANGLE) * SENSOR, agent.y + Math.sin(agent.a - ANGLE) * SENSOR);
      const rx = sample(agent.x + Math.cos(agent.a + ANGLE) * SENSOR, agent.y + Math.sin(agent.a + ANGLE) * SENSOR);

      if (lx > rx && lx > fx) agent.a -= 0.3 * (1 + (lx - fx) * 3);
      else if (rx > lx && rx > fx) agent.a += 0.3 * (1 + (rx - fx) * 3);
      else if (fx < 0.005) agent.a += (Math.random() - 0.5) * 0.5;

      agent.x += Math.cos(agent.a) * SPEED;
      agent.y += Math.sin(agent.a) * SPEED;

      if (agent.x < 0) agent.x += W;
      if (agent.x >= W) agent.x -= W;
      if (agent.y < 0) agent.y += H;
      if (agent.y >= H) agent.y -= H;

      deposit(agent.x, agent.y, 0.03);
    }

    for (let i = 0; i < trail.length; i++) {
      const v = trail[i];
      if (v > 0.001) {
        const x = i % RW;
        let s = v * 0.5;
        if (x > 0) s += trail[i - 1] * 0.125;
        if (x < RW - 1) s += trail[i + 1] * 0.125;
        if (i >= RW) s += trail[i - RW] * 0.125;
        if (i < trail.length - RW) s += trail[i + RW] * 0.125;
        trail[i] = Math.max(0, s - 0.005);
      }
    }
  }

  let time = 0;

  function render() {
    time += 0.005;
    ctx.fillStyle = 'rgba(5, 3, 6, 0.06)';
    ctx.fillRect(0, 0, W, H);

    const step = Math.max(1, Math.floor(scale));
    for (let i = 0; i < trail.length; i++) {
      const v = trail[i];
      if (v > 0.05) {
        const x = (i % RW) * scale;
        const y = Math.floor(i / RW) * scale;
        const hue = 270 + v * 70 + Math.sin(time * 0.5 + i) * 10;
        ctx.fillStyle = `hsla(${hue}, 75%, ${20 + v * 50}%, ${v * 0.7})`;
        ctx.fillRect(x, y, step + 1, step + 1);
      }
    }

    for (const agent of agents) {
      ctx.beginPath();
      ctx.arc(agent.x, agent.y, 1, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${agent.hue}, 60%, 85%, 0.06)`;
      ctx.fill();
    }
  }

  function tick() {
    for (let i = 0; i < 3; i++) simulate();
    render();
    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
</html>
