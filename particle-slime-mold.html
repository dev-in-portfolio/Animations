<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Slime Mold</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050306; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.16); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Slime Mold · tap or click to place food</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  const AGENT_COUNT = 800;
  const SENSOR_DISTANCE = 6;
  const SENSOR_ANGLE = 0.3;
  const SPEED = 1;
  const FIXED_STEP_MS = 1000 / 60;

  let W = 0;
  let H = 0;
  let dpr = 1;
  let scale = 1;
  let RW = 1;
  let RH = 1;
  let trail = new Float32Array(1);
  let nextTrail = new Float32Array(1);
  let agents = [];
  let resizeTimer;
  let rafId = 0;
  let lastTime = performance.now();
  let accumulator = 0;

  function resizeCanvas() {
    W = window.innerWidth;
    H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = `${W}px`;
    canvas.style.height = `${H}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function sample(x, y) {
    const ix = Math.floor(x / scale);
    const iy = Math.floor(y / scale);
    if (ix < 0 || ix >= RW || iy < 0 || iy >= RH) return 0;
    return trail[ix + iy * RW];
  }

  function deposit(x, y, value) {
    const ix = Math.floor(x / scale);
    const iy = Math.floor(y / scale);
    if (ix < 0 || ix >= RW || iy < 0 || iy >= RH) return;
    const index = ix + iy * RW;
    trail[index] = Math.min(1, trail[index] + value);
  }

  function placeFood(cx, cy, count) {
    for (let i = 0; i < count; i++) {
      const x = cx + (Math.random() - 0.5) * 80;
      const y = cy + (Math.random() - 0.5) * 80;
      deposit(x, y, 1);
    }
  }

  function initializeWorld() {
    resizeCanvas();
    scale = Math.max(W, H) / 300;
    RW = Math.max(1, Math.ceil(W / scale));
    RH = Math.max(1, Math.ceil(H / scale));
    trail = new Float32Array(RW * RH);
    nextTrail = new Float32Array(RW * RH);
    agents = [];

    const foodSpots = [];
    for (let i = 0; i < 6; i++) {
      const x = W * (0.2 + Math.random() * 0.6);
      const y = H * (0.2 + Math.random() * 0.6);
      placeFood(x, y, 50);
      foodSpots.push({ x, y });
    }

    for (let i = 0; i < AGENT_COUNT; i++) {
      const spot = foodSpots[Math.floor(Math.random() * foodSpots.length)];
      agents.push({
        x: spot.x + (Math.random() - 0.5) * 40,
        y: spot.y + (Math.random() - 0.5) * 40,
        angle: Math.random() * Math.PI * 2,
        hue: 270 + Math.random() * 60,
      });
    }

    ctx.fillStyle = '#050306';
    ctx.fillRect(0, 0, W, H);
  }

  function diffuseAndDecay() {
    for (let i = 0; i < trail.length; i++) {
      const value = trail[i];
      const x = i % RW;
      let sum = value * 0.5;
      if (x > 0) sum += trail[i - 1] * 0.125;
      if (x < RW - 1) sum += trail[i + 1] * 0.125;
      if (i >= RW) sum += trail[i - RW] * 0.125;
      if (i < trail.length - RW) sum += trail[i + RW] * 0.125;
      nextTrail[i] = Math.max(0, sum - 0.005);
    }

    const previous = trail;
    trail = nextTrail;
    nextTrail = previous;
  }

  function simulate() {
    for (const agent of agents) {
      const forward = sample(
        agent.x + Math.cos(agent.angle) * SENSOR_DISTANCE,
        agent.y + Math.sin(agent.angle) * SENSOR_DISTANCE
      );
      const left = sample(
        agent.x + Math.cos(agent.angle - SENSOR_ANGLE) * SENSOR_DISTANCE,
        agent.y + Math.sin(agent.angle - SENSOR_ANGLE) * SENSOR_DISTANCE
      );
      const right = sample(
        agent.x + Math.cos(agent.angle + SENSOR_ANGLE) * SENSOR_DISTANCE,
        agent.y + Math.sin(agent.angle + SENSOR_ANGLE) * SENSOR_DISTANCE
      );

      if (left > right && left > forward) {
        agent.angle -= 0.3 * (1 + (left - forward) * 3);
      } else if (right > left && right > forward) {
        agent.angle += 0.3 * (1 + (right - forward) * 3);
      } else if (forward < 0.005) {
        agent.angle += (Math.random() - 0.5) * 0.5;
      }

      agent.x += Math.cos(agent.angle) * SPEED;
      agent.y += Math.sin(agent.angle) * SPEED;

      if (agent.x < 0) agent.x += W;
      if (agent.x >= W) agent.x -= W;
      if (agent.y < 0) agent.y += H;
      if (agent.y >= H) agent.y -= H;

      deposit(agent.x, agent.y, 0.03);
    }

    diffuseAndDecay();
  }

  function render(now, frameScale) {
    const time = now * 0.0003;
    const fadeAlpha = 1 - Math.pow(1 - 0.06, frameScale);
    ctx.fillStyle = `rgba(5, 3, 6, ${fadeAlpha})`;
    ctx.fillRect(0, 0, W, H);

    const pixelSize = Math.max(1, Math.floor(scale));
    for (let i = 0; i < trail.length; i++) {
      const value = trail[i];
      if (value <= 0.05) continue;
      const x = (i % RW) * scale;
      const y = Math.floor(i / RW) * scale;
      const hue = 270 + value * 70 + Math.sin(time + i) * 10;
      ctx.fillStyle = `hsla(${hue}, 75%, ${20 + value * 50}%, ${value * 0.7})`;
      ctx.fillRect(x, y, pixelSize + 1, pixelSize + 1);
    }

    for (const agent of agents) {
      ctx.beginPath();
      ctx.arc(agent.x, agent.y, 1, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${agent.hue}, 60%, 85%, 0.06)`;
      ctx.fill();
    }
  }

  function animate(now) {
    const delta = Math.min(Math.max(now - lastTime, 0), 100);
    lastTime = now;
    const frameScale = Math.max(delta / FIXED_STEP_MS, 0.25);

    if (reducedMotion.matches) {
      simulate();
    } else {
      accumulator += delta;
      while (accumulator >= FIXED_STEP_MS) {
        for (let i = 0; i < 3; i++) simulate();
        accumulator -= FIXED_STEP_MS;
      }
    }

    render(now, frameScale);

    if (!reducedMotion.matches && !document.hidden) {
      rafId = requestAnimationFrame(animate);
    }
  }

  function restartAnimation() {
    cancelAnimationFrame(rafId);
    lastTime = performance.now();
    accumulator = 0;
    rafId = requestAnimationFrame(animate);
  }

  canvas.addEventListener('pointerdown', (event) => {
    placeFood(event.clientX, event.clientY, 80);
    if (reducedMotion.matches) restartAnimation();
  });

  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      initializeWorld();
      restartAnimation();
    }, 120);
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) restartAnimation();
    else cancelAnimationFrame(rafId);
  });
  reducedMotion.addEventListener('change', restartAnimation);

  initializeWorld();
  restartAnimation();
</script>
</body>
</html>
