<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Black Hole</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #020206; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.06); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Black Hole · gravitational pull</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const cx = W / 2;
  const cy = H / 2;
  const COUNT = 500;
  const particles = [];

  for (let i = 0; i < COUNT; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = 30 + Math.random() * 350;
    const orbitSpeed = 200 / (r + 50);
    particles.push({
      x: cx + Math.cos(angle) * r,
      y: cy + Math.sin(angle) * r,
      angle,
      radius: r,
      baseRadius: r,
      orbitSpeed: 0.005 + orbitSpeed * 0.03,
      hue: 260 + Math.random() * 40,
      size: 1.5 + Math.random() * 2.5,
      phase: Math.random() * Math.PI * 2,
      falling: Math.random() > 0.7,
    });
  }

  let time = 0;

  function animate() {
    time += 0.003;
    ctx.fillStyle = 'rgba(2, 2, 6, 0.03)';
    ctx.fillRect(0, 0, W, H);

    const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 40);
    coreGrad.addColorStop(0, 'rgba(0, 0, 0, 1)');
    coreGrad.addColorStop(0.5, 'rgba(15, 5, 30, 0.6)');
    coreGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, 40, 0, Math.PI * 2);
    ctx.fill();

    const accretionGrad = ctx.createRadialGradient(cx, cy, 35, cx, cy, 80);
    accretionGrad.addColorStop(0, `hsla(270, 80%, 50%, 0.05)`);
    accretionGrad.addColorStop(0.5, `hsla(260, 70%, 40%, 0.02)`);
    accretionGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = accretionGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, 80, 0, Math.PI * 2);
    ctx.fill();

    for (const p of particles) {
      p.angle += p.orbitSpeed;

      if (p.falling && p.radius > 20) {
        p.radius -= 0.15 + (1 - p.radius / p.baseRadius) * 0.3;
        p.orbitSpeed += 0.0001;
      }

      const wobble = Math.sin(time + p.phase + p.angle) * 2;
      const r = p.radius + wobble;
      const x = cx + Math.cos(p.angle) * r;
      const y = cy + Math.sin(p.angle) * r;

      const dist = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
      const brightness = Math.max(0, 1 - dist / 350);
      const alpha = 0.1 + brightness * 0.4;
      const hue = p.hue + brightness * 30;

      ctx.beginPath();
      ctx.arc(x, y, p.size * (0.3 + brightness * 0.7), 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, 80%, ${40 + brightness * 40}%, ${alpha})`;
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
