<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Well</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050308; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.1); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Gravity Well · particles in orbit</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const particles = [];
  const COUNT = 200;

  for (let i = 0; i < COUNT; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 30 + Math.random() * 250;
    particles.push({
      x: W / 2 + Math.cos(angle) * dist,
      y: H / 2 + Math.sin(angle) * dist,
      vx: Math.cos(angle + Math.PI / 2) * (0.5 + Math.random() * 1.5) * (1 / Math.sqrt(dist / 30)),
      vy: Math.sin(angle + Math.PI / 2) * (0.5 + Math.random() * 1.5) * (1 / Math.sqrt(dist / 30)),
      size: 1 + Math.random() * 2.5,
      hue: 240 + Math.random() * 80,
      trail: [],
    });
  }

  const mouse = { x: W/2, y: H/2, active: false };
  let gravX = W / 2;
  let gravY = H / 2;

  document.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  });

  document.addEventListener('mouseleave', () => {
    mouse.active = false;
  });

  let time = 0;

  function animate() {
    time += 0.003;
    ctx.fillStyle = 'rgba(5, 3, 8, 0.06)';
    ctx.fillRect(0, 0, W, H);

    if (mouse.active) {
      gravX += (mouse.x - gravX) * 0.05;
      gravY += (mouse.y - gravY) * 0.05;
    } else {
      gravX += (W / 2 + Math.sin(time * 0.3) * 100 - gravX) * 0.01;
      gravY += (H / 2 + Math.cos(time * 0.2) * 60 - gravY) * 0.01;
    }

    ctx.beginPath();
    ctx.arc(gravX, gravY, 4, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(280, 80%, 70%, ${0.3 + Math.sin(time) * 0.1})`;
    ctx.fill();

    for (const p of particles) {
      const dx = gravX - p.x;
      const dy = gravY - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const force = 200 / (dist + 20);

      if (dist > 5) {
        p.vx += (dx / dist) * force * 0.003;
        p.vy += (dy / dist) * force * 0.003;
      }

      p.vx *= 0.998;
      p.vy *= 0.998;

      p.x += p.vx;
      p.y += p.vy;

      if (p.x < -50 || p.x > W + 50 || p.y < -50 || p.y > H + 50) {
        const angle = Math.random() * Math.PI * 2;
        const dist2 = 100 + Math.random() * 150;
        p.x = gravX + Math.cos(angle) * dist2;
        p.y = gravY + Math.sin(angle) * dist2;
        p.vx = Math.cos(angle + Math.PI / 2) * (0.5 + Math.random()) * 2;
        p.vy = Math.sin(angle + Math.PI / 2) * (0.5 + Math.random()) * 2;
      }

      const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
      const alpha = Math.min(0.8, 0.2 + speed * 0.3);

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue + speed * 15}, 80%, 60%, ${alpha})`;
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
