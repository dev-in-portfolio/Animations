<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Drift</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a14; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.08); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Drift · windborne</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const COUNT = 150;
  const particles = [];

  for (let i = 0; i < COUNT; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: 2 + Math.random() * 5,
      baseSpeed: 0.1 + Math.random() * 0.2,
      hue: 220 + Math.random() * 60,
      phase: Math.random() * Math.PI * 2,
      driftX: Math.random() * 100 + 50,
      driftPhase: Math.random() * Math.PI * 2,
      alpha: 0.1 + Math.random() * 0.3,
      pulseSpeed: 0.3 + Math.random() * 0.5,
    });
  }

  const mouse = { x: W/2, y: H/2, active: false };
  document.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
  document.addEventListener('mouseleave', () => { mouse.active = false; });

  let time = 0;

  function animate() {
    time += 0.003;
    ctx.fillStyle = 'rgba(10, 10, 20, 0.03)';
    ctx.fillRect(0, 0, W, H);

    const windX = Math.sin(time * 0.1) * 0.3;

    for (const p of particles) {
      const windY = Math.sin(time * 0.05 + p.driftPhase) * 0.1;
      p.x += windX + p.baseSpeed * Math.sin(time * 0.02 + p.driftPhase);
      p.y += windY + p.baseSpeed * 0.3;

      if (mouse.active) {
        const dx = p.x - mouse.x;
        const dy = p.y - mouse.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < 100) {
          p.x += (dx / d) * 0.3;
          p.y += (dy / d) * 0.3;
        }
      }

      if (p.x < -50) p.x = W + 50;
      if (p.x > W + 50) p.x = -50;
      if (p.y < -50) p.y = H + 50;
      if (p.y > H + 50) p.y = -50;

      const pulse = 0.5 + Math.sin(time * p.pulseSpeed + p.phase) * 0.5;
      const alpha = p.alpha * pulse;
      const size = p.size * (0.5 + pulse * 0.5);
      const hue = p.hue + Math.sin(time * 0.3 + p.phase) * 15;

      ctx.beginPath();
      ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, 60%, 60%, ${alpha})`;
      ctx.fill();

      if (pulse > 0.6) {
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 4);
        grad.addColorStop(0, `hsla(${hue}, 70%, 65%, ${alpha * 0.08})`);
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, size * 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
