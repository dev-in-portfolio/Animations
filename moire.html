<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moire</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050508; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.1); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Moire · overlapping interference</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  let time = 0;
  const mouse = { x: W / 2, y: H / 2 };

  document.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  function animate() {
    time += 0.003;
    ctx.fillStyle = 'rgba(5, 5, 8, 0.03)';
    ctx.fillRect(0, 0, W, H);

    const cx = W / 2 + (mouse.x - W / 2) * 0.02;
    const cy = H / 2 + (mouse.y - H / 2) * 0.02;

    for (let ring = 0; ring < 20; ring++) {
      const r = 30 + ring * 14 + Math.sin(time * 0.5 + ring * 0.3) * 5;
      const alpha = 0.04 + Math.sin(time + ring * 0.5) * 0.02;

      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = `hsla(${200 + ring * 3 + Math.sin(time * 0.3 + ring) * 10}, 80%, 60%, ${Math.max(0, alpha)})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    for (let ring = 0; ring < 20; ring++) {
      const r = 40 + ring * 13 + Math.cos(time * 0.4 + ring * 0.4) * 4;
      const alpha = 0.04 + Math.cos(time * 0.7 + ring * 0.6) * 0.02;

      ctx.beginPath();
      const offsetX = Math.cos(time * 0.2) * 40;
      const offsetY = Math.sin(time * 0.15) * 30;
      ctx.arc(cx + offsetX, cy + offsetY, r, 0, Math.PI * 2);
      ctx.strokeStyle = `hsla(${50 + ring * 5 + Math.cos(time * 0.4 + ring) * 10}, 80%, 60%, ${Math.max(0, alpha)})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const t = (i / 200) * Math.PI * 2;
      const r = 50 + Math.sin(t * 5 + time * 2) * 30 + Math.cos(t * 3 + time * 1.5) * 20;
      const x = cx + Math.cos(t) * r;
      const y = cy + Math.sin(t) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = `hsla(${280 + Math.sin(time) * 20}, 70%, 60%, 0.06)`;
    ctx.lineWidth = 1;
    ctx.stroke();

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
