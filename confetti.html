<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confetti</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #08080a; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.1); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Confetti · celebration shower</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const pieces = [];

  function createPiece(x, y) {
    const shapes = ['rect', 'circle', 'triangle'];
    return {
      x: x || Math.random() * W,
      y: y || -20,
      vx: (Math.random() - 0.5) * 3,
      vy: Math.random() * 2 + 1,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.05,
      size: 4 + Math.random() * 8,
      hue: Math.random() * 360,
      alpha: 0.6 + Math.random() * 0.4,
      shape: shapes[Math.floor(Math.random() * shapes.length)],
      phase: Math.random() * Math.PI * 2,
    };
  }

  for (let i = 0; i < 150; i++) {
    pieces.push(createPiece());
  }

  document.addEventListener('click', (e) => {
    for (let i = 0; i < 30; i++) {
      pieces.push(createPiece(e.clientX + (Math.random() - 0.5) * 100, e.clientY));
    }
  });

  let time = 0;

  function animate() {
    time += 0.005;
    ctx.fillStyle = 'rgba(8, 8, 10, 0.02)';
    ctx.fillRect(0, 0, W, H);

    for (let i = pieces.length - 1; i >= 0; i--) {
      const p = pieces[i];
      p.x += p.vx + Math.sin(time + p.phase) * 0.2;
      p.y += p.vy;
      p.vy += 0.01;
      p.rotation += p.rotSpeed;

      if (p.y > H + 20 || p.x < -50 || p.x > W + 50) {
        pieces.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.globalAlpha = p.alpha * Math.min(1, (p.y + 20) / 100);

      ctx.fillStyle = `hsla(${p.hue + Math.sin(time + p.phase) * 20}, 80%, 60%, 0.7)`;

      switch(p.shape) {
        case 'rect':
          ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
          break;
        case 'circle':
          ctx.beginPath();
          ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
          ctx.fill();
          break;
        case 'triangle':
          ctx.beginPath();
          ctx.moveTo(0, -p.size / 2);
          ctx.lineTo(-p.size / 2, p.size / 2);
          ctx.lineTo(p.size / 2, p.size / 2);
          ctx.closePath();
          ctx.fill();
          break;
      }

      ctx.restore();
    }

    if (pieces.length < 100 && Math.random() < 0.1) {
      pieces.push(createPiece());
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
