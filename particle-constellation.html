<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constellation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #06060e; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.08); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Constellation · click to reconnect</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const stars = [];
  const STAR_COUNT = 60;
  const connections = [];
  const mouse = { x: W/2, y: H/2 };

  for (let i = 0; i < STAR_COUNT; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.1,
      vy: (Math.random() - 0.5) * 0.1,
      r: 2 + Math.random() * 3,
      brightness: Math.random(),
      phase: Math.random() * Math.PI * 2,
      hue: 220 + Math.random() * 60,
      pulseSpeed: 0.5 + Math.random() * 0.5,
    });
  }

  function buildConnections() {
    connections.length = 0;
    for (let i = 0; i < STAR_COUNT; i++) {
      for (let j = i + 1; j < STAR_COUNT; j++) {
        const dx = stars[i].x - stars[j].x;
        const dy = stars[i].y - stars[j].y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < 200 && Math.random() < 0.15) {
          connections.push({ i, j, maxDist: 150 + Math.random() * 100 });
        }
      }
    }
  }
  buildConnections();

  document.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  document.addEventListener('click', () => {
    for (const s of stars) {
      s.x += (Math.random() - 0.5) * 200;
      s.y += (Math.random() - 0.5) * 200;
    }
    buildConnections();
  });

  let time = 0;

  function animate() {
    time += 0.003;
    ctx.fillStyle = 'rgba(6, 6, 14, 0.15)';
    ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
      const dx = mouse.x - s.x;
      const dy = mouse.y - s.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 100) {
        s.vx -= dx * 0.0005;
        s.vy -= dy * 0.0005;
      }
      s.vx *= 0.99;
      s.vy *= 0.99;
      s.x += s.vx;
      s.y += s.vy;
      if (s.x < 0) s.x = W;
      if (s.x > W) s.x = 0;
      if (s.y < 0) s.y = H;
      if (s.y > H) s.y = 0;
    }

    for (const conn of connections) {
      const a = stars[conn.i];
      const b = stars[conn.j];
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < conn.maxDist) {
        const alpha = (1 - d / conn.maxDist) * 0.3;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = `hsla(220, 60%, 60%, ${alpha})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }

    for (const s of stars) {
      const pulse = 0.6 + Math.sin(time * s.pulseSpeed + s.phase) * 0.4;

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * pulse, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${s.hue}, 70%, ${60 + pulse * 30}%, ${0.4 + pulse * 0.4})`;
      ctx.fill();

      const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 6);
      grad.addColorStop(0, `hsla(${s.hue}, 80%, 75%, ${pulse * 0.06})`);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 6, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
