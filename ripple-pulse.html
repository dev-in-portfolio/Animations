<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ripple Pulse</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a12; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.1); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Ripple Pulse · drifting concentric rings</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  let time = 0;
  const cx = W / 2;
  const cy = H / 2;

  const ripples = [];
  for (let i = 0; i < 8; i++) {
    ripples.push({
      radius: i * 40,
      maxRadius: 200 + i * 60,
      speed: 0.3 + i * 0.05,
      phase: i * 0.5,
      hue: 160 + i * 12,
      thickness: 1 + i * 0.3,
      opacity: 0.4 - i * 0.04,
    });
  }

  function animate() {
    time += 0.008;
    ctx.fillStyle = 'rgba(10, 10, 18, 0.06)';
    ctx.fillRect(0, 0, W, H);

    const centerX = cx + Math.sin(time * 0.5) * 100;
    const centerY = cy + Math.cos(time * 0.3) * 50;

    ctx.save();
    ctx.translate(centerX, centerY);

    for (const r of ripples) {
      const current = r.radius + Math.sin(time * r.speed + r.phase) * 30;
      const alpha = r.opacity * (0.5 + Math.sin(time * r.speed + r.phase) * 0.3);

      ctx.beginPath();
      ctx.arc(0, 0, Math.max(0, current), 0, Math.PI * 2);
      ctx.strokeStyle = `hsla(${r.hue + Math.sin(time * 0.5 + r.phase) * 20}, 80%, 60%, ${Math.max(0, alpha)})`;
      ctx.lineWidth = r.thickness;
      ctx.stroke();

      if (current > 5) {
        ctx.beginPath();
        ctx.arc(0, 0, current * 0.6, 0, Math.PI * 2);
        ctx.strokeStyle = `hsla(${r.hue + 30 + Math.sin(time * 0.7 + r.phase) * 15}, 70%, 50%, ${Math.max(0, alpha * 0.3)})`;
        ctx.lineWidth = r.thickness * 0.5;
        ctx.stroke();
      }
    }

    ctx.restore();

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
