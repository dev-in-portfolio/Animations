<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dendrite</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #05050a; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.1); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Dendrite · branching patterns</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const branches = [];
  let time = 0;
  const mouse = { x: W / 2, y: H / 2 };

  document.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  function growBranch(x, y, angle, length, depth, hue, maxDepth) {
    if (depth > maxDepth || length < 2) return null;

    const endX = x + Math.cos(angle) * length;
    const endY = y + Math.sin(angle) * length;

    const branch = {
      x1: x, y1: y,
      x2: endX, y2: endY,
      hue: hue + (Math.random() - 0.5) * 20,
      alpha: 0.1 + (1 - depth / maxDepth) * 0.2,
      width: Math.max(0.3, (1 - depth / maxDepth) * 2),
      grow: 0,
      speed: 0.01 + Math.random() * 0.02,
      children: [],
    };

    const childCount = depth < maxDepth / 2 ? 2 + Math.floor(Math.random() * 2) : Math.random() > 0.5 ? 1 : 0;
    for (let i = 0; i < childCount; i++) {
      const childAngle = angle + (Math.random() - 0.5) * 1.2;
      const childLen = length * (0.5 + Math.random() * 0.2);
      const child = growBranch(endX, endY, childAngle, childLen, depth + 1, hue + (Math.random() - 0.5) * 30, maxDepth);
      if (child) branch.children.push(child);
    }

    return branch;
  }

  function spawnTree() {
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.5;
    return growBranch(mouse.x, mouse.y, angle, 50 + Math.random() * 30, 0, 200 + Math.random() * 60, 6);
  }

  let trees = [];

  function animate() {
    time += 0.005;
    ctx.fillStyle = 'rgba(5, 5, 10, 0.03)';
    ctx.fillRect(0, 0, W, H);

    if (trees.length < 3 && Math.random() < 0.005) {
      const tree = spawnTree();
      if (tree) trees.push(tree);
    }

    function drawBranch(b) {
      if (b.grow < 1) {
        b.grow = Math.min(1, b.grow + b.speed);
      }

      const gx = b.x1 + (b.x2 - b.x1) * b.grow;
      const gy = b.y1 + (b.y2 - b.y1) * b.grow;

      ctx.beginPath();
      ctx.moveTo(b.x1, b.y1);
      ctx.lineTo(gx, gy);
      ctx.strokeStyle = `hsla(${b.hue + Math.sin(time * 0.5 + b.x1 * 0.01) * 10}, 70%, 60%, ${b.alpha * b.grow})`;
      ctx.lineWidth = b.width * b.grow;
      ctx.lineCap = 'round';
      ctx.stroke();

      for (const child of b.children) {
        drawBranch(child);
      }
    }

    for (let i = trees.length - 1; i >= 0; i--) {
      const allGrown = (function check(t) {
        if (t.grow < 1) return false;
        for (const c of t.children) {
          if (!check(c)) return false;
        }
        return true;
      })(trees[i]);

      if (allGrown) {
        trees[i].decay = (trees[i].decay || 0) + 0.001;
        if (trees[i].decay > 1) {
          trees.splice(i, 1);
          continue;
        }
      }

      drawBranch(trees[i]);
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
