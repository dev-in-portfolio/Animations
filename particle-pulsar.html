<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Pulsar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #06060e; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.08); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Pulsar · rhythmic star</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const cx = W / 2;
  const cy = H / 2;
  const rings = [];
  const particles = [];

  for (let i = 0; i < 200; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = 5 + Math.random() * 200;
    particles.push({
      x: cx + Math.cos(angle) * r,
      y: cy + Math.sin(angle) * r,
      baseR: r,
      angle,
      speed: 0.001 + Math.random() * 0.003,
      hue: 260 + Math.random() * 60,
      size: 1 + Math.random() * 2,
      phase: Math.random() * Math.PI * 2,
    });
  }

  let time = 0;
  let pulse = 0;

  function animate() {
    time += 0.005;
    ctx.fillStyle = 'rgba(6, 6, 14, 0.04)';
    ctx.fillRect(0, 0, W, H);

    pulse = Math.sin(time * 2) * 0.5 + 0.5;

    const coreSize = 10 + pulse * 20;
    const coreAlpha = 0.3 + pulse * 0.5;

    const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreSize);
    coreGrad.addColorStop(0, `hsla(280, 90%, 80%, ${coreAlpha})`);
    coreGrad.addColorStop(0.5, `hsla(260, 80%, 60%, ${coreAlpha * 0.5})`);
    coreGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, coreSize, 0, Math.PI * 2);
    ctx.fill();

    const ringRadius = 30 + pulse * 160;
    ctx.beginPath();
    ctx.arc(cx, cy, ringRadius, 0, Math.PI * 2);
    ctx.strokeStyle = `hsla(270, 80%, 60%, ${(1 - pulse) * 0.15})`;
    ctx.lineWidth = 1 + pulse * 2;
    ctx.stroke();

    for (const p of particles) {
      p.angle += p.speed;
      const wobble = Math.sin(time + p.phase) * 3;
      const r = p.baseR + wobble + pulse * 5;
      const x = cx + Math.cos(p.angle) * r;
      const y = cy + Math.sin(p.angle) * r;

      const dist = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
      const brightness = 1 - Math.min(1, dist / 250);
      const alpha = 0.1 + brightness * 0.3 + pulse * 0.2;

      ctx.beginPath();
      ctx.arc(x, y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue + pulse * 20}, 80%, ${50 + brightness * 25}%, ${alpha})`;
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
