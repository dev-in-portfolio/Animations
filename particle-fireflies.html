<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Fireflies</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: linear-gradient(180deg, #0a0a14 0%, #141425 40%, #1a1a2e 100%); overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.1); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Fireflies · move mouse to scatter</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const COUNT = 100;
  const fireflies = [];

  for (let i = 0; i < COUNT; i++) {
    fireflies.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: 0,
      vy: 0,
      baseSpeed: 0.15 + Math.random() * 0.25,
      wanderAngle: Math.random() * Math.PI * 2,
      size: 1.5 + Math.random() * 3,
      brightness: Math.random(),
      phase: Math.random() * Math.PI * 2,
      hue: 40 + Math.random() * 30,
    });
  }

  const mouse = { x: -1000, y: -1000 };

  document.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  document.addEventListener('mouseleave', () => {
    mouse.x = -1000;
    mouse.y = -1000;
  });

  let time = 0;

  function animate() {
    time += 0.005;
    ctx.fillStyle = 'rgba(10, 10, 20, 0.08)';
    ctx.fillRect(0, 0, W, H);

    for (const f of fireflies) {
      f.wanderAngle += (Math.random() - 0.5) * 0.8;
      f.vx += Math.cos(f.wanderAngle) * 0.02;
      f.vy += Math.sin(f.wanderAngle) * 0.02;

      const dx = f.x - mouse.x;
      const dy = f.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 150) {
        const force = (1 - dist / 150) * 1.5;
        f.vx += (dx / dist) * force;
        f.vy += (dy / dist) * force;
      }

      const speed = Math.sqrt(f.vx * f.vx + f.vy * f.vy);
      if (speed > f.baseSpeed) {
        f.vx *= 0.96;
        f.vy *= 0.96;
      }

      f.x += f.vx;
      f.y += f.vy;

      if (f.x < -20) f.x = W + 20;
      if (f.x > W + 20) f.x = -20;
      if (f.y < -20) f.y = H + 20;
      if (f.y > H + 20) f.y = -20;

      const glow = 0.3 + Math.sin(time * 2 + f.phase) * 0.3;

      ctx.beginPath();
      ctx.arc(f.x, f.y, f.size * glow, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${f.hue}, 80%, 75%, ${glow * 0.6})`;
      ctx.fill();

      const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.size * 8);
      grad.addColorStop(0, `hsla(${f.hue}, 90%, 80%, ${glow * 0.15})`);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.size * 8, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
