<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morphing Blob</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d0d;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }
  .blob-container {
    position: relative;
    width: 400px;
    height: 400px;
    animation: rotate 20s linear infinite;
  }
  .blob {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #6e44ff, #ff6b6b, #ffd93d, #6bcbff);
    border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
    animation: morph 8s ease-in-out infinite alternate;
    filter: blur(2px);
    opacity: 0.7;
  }
  .blob-shadow {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #6e44ff, #ff6b6b, #ffd93d, #6bcbff);
    border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
    animation: morph 8s ease-in-out infinite alternate;
    filter: blur(60px);
    opacity: 0.3;
    z-index: -1;
  }
  .blob-inner {
    position: absolute;
    inset: 0;
    background: #0d0d0d;
    border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
    animation: morph 8s ease-in-out infinite alternate;
    scale: 0.85;
  }
  @keyframes morph {
    0% { border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; }
    25% { border-radius: 58% 42% 30% 70% / 55% 65% 35% 45%; }
    50% { border-radius: 30% 70% 42% 58% / 65% 35% 55% 45%; }
    75% { border-radius: 70% 30% 58% 42% / 35% 55% 45% 65%; }
    100% { border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; }
  }
  @keyframes rotate {
    to { transform: rotate(360deg); }
  }
  .label {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.15);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="blob-container">
    <div class="blob-shadow"></div>
    <div class="blob"></div>
    <div class="blob-inner"></div>
  </div>
  <div class="label">Morphing Blob · pure CSS</div>
</body>
</html>
