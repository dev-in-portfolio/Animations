<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050510; overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .label { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.1); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Aurora · flowing light curtains</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const layers = [];
  for (let i = 0; i < 4; i++) {
    const points = [];
    const count = 60;
    for (let j = 0; j < count; j++) {
      points.push({
        y: Math.random(),
        speed: 0.1 + Math.random() * 0.3,
        phase: Math.random() * Math.PI * 2,
      });
    }
    layers.push({
      points,
      hue: 160 + i * 40,
      alpha: 0.06 + Math.random() * 0.06,
      yBase: 0.1 + i * 0.12,
      height: 0.15 + Math.random() * 0.1,
      speed: 0.3 + Math.random() * 0.4,
    });
  }

  let time = 0;
  const mouse = { x: W / 2, influence: 0 };

  document.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.influence = Math.min(1, mouse.influence + 0.05);
  });

  function animate() {
    time += 0.003;
    mouse.influence *= 0.98;

    ctx.fillStyle = 'rgba(5, 5, 16, 0.15)';
    ctx.fillRect(0, 0, W, H);

    for (const layer of layers) {
      ctx.beginPath();

      for (let i = 0; i < layer.points.length; i++) {
        const p = layer.points[i];
        const x = (i / layer.points.length) * W;
        const wave = Math.sin(time * layer.speed * 2 + i * 0.15 + p.phase) * 0.5;
        const wave2 = Math.sin(time * layer.speed * 1.3 + i * 0.08) * 0.3;
        const mousePull = (mouse.x / W - 0.5) * mouse.influence * 0.15;

        const y = (layer.yBase + p.y * layer.height + wave * layer.height + wave2 * layer.height * 0.5 + mousePull) * H;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.lineTo(W, H);
      ctx.lineTo(0, H);
      ctx.closePath();

      const grad = ctx.createLinearGradient(0, 0, W, 0);
      const hueShift = Math.sin(time * 0.2 + layer.hue * 0.01) * 15;
      grad.addColorStop(0, `hsla(${layer.hue + hueShift}, 80%, 50%, 0)`);
      grad.addColorStop(0.3, `hsla(${layer.hue + 20 + hueShift}, 85%, 55%, ${layer.alpha})`);
      grad.addColorStop(0.5, `hsla(${layer.hue + 40 + hueShift}, 90%, 60%, ${layer.alpha * 1.2})`);
      grad.addColorStop(0.7, `hsla(${layer.hue + 20 + hueShift}, 85%, 55%, ${layer.alpha})`);
      grad.addColorStop(1, `hsla(${layer.hue + hueShift}, 80%, 50%, 0)`);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
